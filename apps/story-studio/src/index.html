<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Fantasia Story Studio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./scene.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fantasia Narrative Tool</p>
          <h1>Story Studio</h1>
        </div>
        <div class="topbar-actions">
          <button id="play-node" type="button" class="primary-button">▶ Play Node</button>
          <button id="toggle-density" type="button" class="secondary-button">Compact</button>
          <button id="export-json" type="button" class="secondary-button">Export JSON</button>
        </div>
      </header>

      <main class="workspace" aria-live="polite">
        <aside class="rail" aria-label="Story navigation">
          <div class="rail-heading">
            <span class="section-label">Story</span>
            <span id="story-status" class="status-pill">Loading</span>
          </div>
          <div id="story-tree" class="story-tree"></div>
        </aside>

        <section class="reader" aria-label="Selected story node">
          <div id="node-header" class="node-header"></div>
          <div id="scene-preview" class="scene-preview"></div>
          <nav id="beat-timeline" class="beat-timeline" aria-label="Node beat timeline"></nav>
          <div id="event-list" class="event-list"></div>
        </section>

        <aside class="inspector" aria-label="Beat details">
          <div class="inspector-heading">
            <span class="section-label">Beat details</span>
            <span id="selection-id" class="mono muted">No beat selected</span>
          </div>
          <div id="inspector-content" class="inspector-content empty-state">
            Select a beat to inspect its game-facing details.
          </div>
        </aside>
      </main>

      <footer class="footer-note">
        <span>JSON-backed narrative production view.</span>
        <span>Timing and staging are planning aids; controlled Drive decisions remain authoritative.</span>
      </footer>
    </div>

    <div id="player-overlay" class="player-overlay" hidden>
      <div class="player-shell" role="dialog" aria-modal="true" aria-labelledby="player-title">
        <div class="player-toolbar">
          <div>
            <p class="eyebrow">Play Node</p>
            <strong id="player-title">Story preview</strong>
          </div>
          <button id="close-player" type="button" class="secondary-button">Close</button>
        </div>
        <div id="player-stage" class="player-stage"></div>
        <div id="player-copy" class="player-copy"></div>
        <div class="player-controls">
          <button id="player-prev" type="button" class="secondary-button">← Previous</button>
          <span id="player-progress" class="mono muted"></span>
          <button id="player-next" type="button" class="primary-button">Next →</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
