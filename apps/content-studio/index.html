<!doctype html>
<html lang="en" data-studio-theme="fantasia-midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/styles/material-fidelity.css" />
    <title>Fantasia Content Studio</title>
  </head>
  <body>
    <div id="studio-app"></div>
    <div id="app"></div>
    <div id="workspace-lab"></div>
    <div id="component-inventory"></div>
    <script type="module">
      const labMode = new URLSearchParams(window.location.search).get("lab") === "1";
      if (labMode) {
        await import("/src/main.tsx");
        await import("/src/workspace-lab.tsx");
        await import("/src/component-inventory.tsx");
      } else {
        await import("/src/production-studio.tsx");
      }
    </script>
  </body>
</html>
