name: GAME-UI07 apply

on:
  push:
    branches:
      - game-ui07/battle-keyboard-nav

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui07/battle-keyboard-nav
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Apply GAME-UI07 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          battle_path = Path('apps/web/src/battle.tsx')
          text = battle_path.read_text()
          text = text.replace(
              '  type ProductionBattleView,\n',
              '  type ProductionBattleCellView,\n  type ProductionBattleView,\n',
              1,
          )

          old_start = '      onCellActivate: (cell) => {\n'
          old_end = '      onCellPreview: (cell) => {\n'
          start = text.index(old_start)
          end = text.index(old_end, start)
          text = text[:start] + '      onCellActivate: (cell) => activateCell(cell),\n' + text[end:]

          ref_marker = '  const previewGoalRef = useRef<PreviewGoal | undefined>(previewGoal);\n'
          ref_insert = '''  const previewGoalRef = useRef<PreviewGoal | undefined>(previewGoal);\n  const cellButtonRefs = useRef(new Map<string, HTMLButtonElement>());\n  const [keyboardCellKey, setKeyboardCellKey] = useState(() => {\n    const activeCell = view.cells.find((cell) => cell.occupantActorId === view.activeActorId);\n    return activeCell ? `${activeCell.x}:${activeCell.y}` : `${view.bounds.minX}:${view.bounds.minY}`;\n  });\n'''
          text = text.replace(ref_marker, ref_insert, 1)

          derived_marker = '''  const reachableCells = view.cells.filter(\n    (cell) => cell.reachable && !cell.blocked && cell.occupantActorId === undefined,\n  );\n\n'''
          derived_insert = derived_marker + '''  const keyboardCells = [...view.cells].sort((left, right) => left.y - right.y || left.x - right.x);\n  const keyboardGridColumns = view.bounds.maxX - view.bounds.minX + 1;\n\n'''
          text = text.replace(derived_marker, derived_insert, 1)

          function_marker = '  function resetPreview(nextMode: ActionMode = "inspect") {\n'
          functions = '''  function cellKey(cell: Pick<ProductionBattleCellView, "x" | "y">): string {\n    return `${cell.x}:${cell.y}`;\n  }\n\n  function cellAccessibleLabel(cell: ProductionBattleCellView): string {\n    const occupant = view.actors.find((actor) => actor.id === cell.occupantActorId);\n    const parts = [`Square ${cell.x}, ${cell.y}`, `elevation ${cell.elevation}`];\n    if (cell.blocked) parts.push("blocked terrain");\n    if (occupant) {\n      parts.push(`${occupant.name}, ${occupant.side === "player" ? "ally" : "opponent"}`);\n      if (occupant.active) parts.push("active unit");\n      if (occupant.selected) parts.push("selected unit");\n    } else {\n      parts.push("empty");\n    }\n    if (cell.reachable && !cell.blocked && !occupant) {\n      parts.push(`reachable, movement cost ${cell.reachableCost ?? "unknown"}`);\n    } else if (!cell.blocked && !occupant) {\n      parts.push("not currently reachable");\n    }\n    if (cell.path) parts.push("preview path");\n    return parts.join(", ");\n  }\n\n  function focusBattlefieldNeighbor(cell: ProductionBattleCellView, key: string) {\n    const offset =\n      key === "ArrowLeft"\n        ? { x: -1, y: 0 }\n        : key === "ArrowRight"\n          ? { x: 1, y: 0 }\n          : key === "ArrowUp"\n            ? { x: 0, y: -1 }\n            : key === "ArrowDown"\n              ? { x: 0, y: 1 }\n              : undefined;\n    if (!offset) return;\n    const target = view.cells.find(\n      (candidate) => candidate.x === cell.x + offset.x && candidate.y === cell.y + offset.y,\n    );\n    if (!target) return;\n    const targetKey = cellKey(target);\n    setKeyboardCellKey(targetKey);\n    requestAnimationFrame(() => cellButtonRefs.current.get(targetKey)?.focus());\n  }\n\n  function activateCell(cell: ProductionBattleCellView) {\n    const current = viewRef.current;\n    const mode = modeRef.current;\n\n    if (mode === "attack") {\n      if (cell.occupantActorId === undefined) {\n        setMessage("Choose an opposing unit for the attack preview.");\n        return;\n      }\n      const target = current.actors.find((actor) => actor.id === cell.occupantActorId);\n      const active = current.actors.find((actor) => actor.id === current.activeActorId);\n      if (target && active && target.side !== active.side && !target.defeated) {\n        setAttackTargetId(target.id);\n        setMessage(`${target.name} selected as the attack target. Confirm the attack to commit.`);\n        return;\n      }\n      setMessage("Choose an opposing unit for the attack preview.");\n      return;\n    }\n\n    if (mode === "move") {\n      if (cell.occupantActorId !== undefined || !cell.reachable || cell.blocked) {\n        setMessage("Choose an empty reachable square for the move preview.");\n        return;\n      }\n      if (current.selectedActorId !== current.activeActorId) {\n        setMessage(`Only ${current.activeActorName} can move this turn.`);\n        return;\n      }\n      const goal = { x: cell.x, y: cell.y };\n      setPreviewGoal(goal);\n      const preview = battle.view(goal);\n      setView(preview);\n      setMessage(`Move preview: ${cell.x}, ${cell.y}. Confirm move to commit.`);\n      return;\n    }\n\n    if (cell.occupantActorId !== undefined) {\n      const selected = battle.selectActor(cell.occupantActorId);\n      if (selected) {\n        setView(selected);\n        setMessage(`${selected.selectedActorName} selected for inspection.`);\n      }\n      return;\n    }\n\n    setMessage(\n      cell.blocked\n        ? `Square ${cell.x}, ${cell.y} is blocked terrain.`\n        : `Square ${cell.x}, ${cell.y} is empty.`,\n    );\n  }\n\n'''
          text = text.replace(function_marker, functions + function_marker, 1)

          text = text.replace(
              '<section class={`command-preview mode-${actionMode}`} aria-live="polite">',
              '<section class={`command-preview mode-${actionMode}`}>',
              1,
          )
          text = text.replace(
              '<section class="battle-feedback" aria-live="polite">',
              '<section class="battle-feedback" role="status" aria-live="polite" aria-atomic="true">',
              1,
          )

          details_marker = '''            </dl>\n\n            {actionMode === "move" ? (\n'''
          navigator = '''            </dl>\n\n            <section class="keyboard-battlefield-navigation" aria-labelledby="keyboard-battlefield-title">\n              <div class="keyboard-battlefield-heading">\n                <div>\n                  <p class="hud-eyebrow">Keyboard battlefield</p>\n                  <strong id="keyboard-battlefield-title">Logical cell navigator</strong>\n                </div>\n                <span>Arrow keys move focus · Enter or Space selects</span>\n              </div>\n              <div class="keyboard-battlefield-scroll">\n                <div\n                  class="keyboard-battlefield-grid"\n                  role="group"\n                  aria-label="Battlefield cells in logical square coordinates"\n                  style={{ gridTemplateColumns: `repeat(${keyboardGridColumns}, minmax(44px, 1fr))` }}\n                >\n                  {keyboardCells.map((cell) => {\n                    const occupant = view.actors.find((actor) => actor.id === cell.occupantActorId);\n                    const key = cellKey(cell);\n                    return (\n                      <button\n                        type="button"\n                        class={`keyboard-battlefield-cell${cell.blocked ? " is-blocked" : ""}${cell.reachable ? " is-reachable" : ""}${cell.path ? " is-path" : ""}${occupant?.active ? " is-active" : ""}${occupant?.selected ? " is-selected" : ""}`}\n                        data-battle-cell={key}\n                        aria-label={cellAccessibleLabel(cell)}\n                        aria-pressed={occupant?.selected ?? false}\n                        tabIndex={keyboardCellKey === key ? 0 : -1}\n                        ref={(element) => {\n                          if (element) cellButtonRefs.current.set(key, element);\n                          else cellButtonRefs.current.delete(key);\n                        }}\n                        onFocus={() => setKeyboardCellKey(key)}\n                        onKeyDown={(event) => {\n                          if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {\n                            return;\n                          }\n                          event.preventDefault();\n                          focusBattlefieldNeighbor(cell, event.key);\n                        }}\n                        onClick={() => {\n                          setKeyboardCellKey(key);\n                          activateCell(cell);\n                        }}\n                      >\n                        <span>{cell.x},{cell.y}</span>\n                        <strong>{occupant?.shortLabel ?? "·"}</strong>\n                        <small>\n                          {cell.blocked\n                            ? "Blocked"\n                            : cell.reachable && !occupant\n                              ? `Move ${cell.reachableCost ?? "—"}`\n                              : `E${cell.elevation}`}\n                        </small>\n                      </button>\n                    );\n                  })}\n                </div>\n              </div>\n            </section>\n\n            {actionMode === "move" ? (\n'''
          if details_marker not in text:
              raise SystemExit('unit details insertion marker not found')
          text = text.replace(details_marker, navigator, 1)
          battle_path.write_text(text)

          css_path = Path('apps/web/src/production.css')
          css = css_path.read_text()
          css += '''\n\n/* GAME-UI07 semantic keyboard battlefield navigator */\n.keyboard-battlefield-navigation {\n  display: grid;\n  gap: 12px;\n  margin-top: 16px;\n}\n\n.keyboard-battlefield-heading {\n  display: flex;\n  align-items: end;\n  justify-content: space-between;\n  gap: 12px;\n}\n\n.keyboard-battlefield-heading > span {\n  color: var(--text-secondary);\n  font-size: 0.8rem;\n  text-align: right;\n}\n\n.keyboard-battlefield-scroll {\n  max-width: 100%;\n  overflow-x: auto;\n  padding: 2px;\n}\n\n.keyboard-battlefield-grid {\n  display: grid;\n  gap: 4px;\n  min-width: 380px;\n}\n\n.keyboard-battlefield-cell {\n  min-width: 44px;\n  min-height: 58px;\n  display: grid;\n  place-items: center;\n  align-content: center;\n  gap: 1px;\n  padding: 4px;\n  border: 1px solid var(--border-control);\n  border-radius: 4px;\n  background: var(--surface-background);\n  color: var(--text-primary);\n  line-height: 1.05;\n}\n\n.keyboard-battlefield-cell > span,\n.keyboard-battlefield-cell > small {\n  color: var(--text-secondary);\n  font-size: 0.68rem;\n}\n\n.keyboard-battlefield-cell.is-blocked {\n  border-style: dashed;\n}\n\n.keyboard-battlefield-cell.is-reachable:not(.is-blocked) {\n  box-shadow: inset 0 0 0 1px var(--status-complete);\n}\n\n.keyboard-battlefield-cell.is-active::after {\n  content: "Active";\n  font-size: 0.62rem;\n}\n\n.keyboard-battlefield-cell.is-selected {\n  outline: 2px solid var(--accent-primary);\n  outline-offset: -3px;\n}\n\n.keyboard-battlefield-cell:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n  position: relative;\n  z-index: 1;\n}\n\n@media (max-width: 767px), (max-height: 499px) {\n  .keyboard-battlefield-heading {\n    align-items: start;\n    flex-direction: column;\n  }\n\n  .keyboard-battlefield-heading > span {\n    text-align: left;\n  }\n}\n'''
          css_path.write_text(css)

          test_path = Path('tests/e2e/battle-keyboard.spec.ts')
          test_path.write_text('''import { expect, test } from "@playwright/test";\n\nasync function pressFocused(locator: ReturnType<import("@playwright/test").Page["getByRole"]>) {\n  await locator.focus();\n  await locator.press("Enter");\n}\n\ntest("battle supports logical-cell keyboard navigation without pointer input", async ({ page }, testInfo) => {\n  test.skip(testInfo.project.name !== "chromium-desktop", "Keyboard spatial-navigation proof is desktop scoped");\n  await page.goto("/");\n\n  await pressFocused(page.getByRole("button", { name: "Back", exact: true }));\n  await pressFocused(page.getByRole("button", { name: "Development battle sandbox", exact: true }));\n  await expect(page.getByText("Scout's turn", { exact: true })).toBeVisible();\n\n  const unitDetails = page.locator("details.unit-details-sheet");\n  await unitDetails.locator("summary").focus();\n  await unitDetails.locator("summary").press("Enter");\n  await expect(unitDetails).toHaveAttribute("open", "");\n\n  const status = page.getByRole("status");\n  await expect(status).toHaveCount(1);\n  await expect(page.locator(".command-preview[aria-live]")).toHaveCount(0);\n\n  const enemyCell = page.locator('[data-battle-cell="2:5"]');\n  await enemyCell.focus();\n  await enemyCell.press("Enter");\n  await expect(unitDetails.getByText("Lancer · Opponent", { exact: true })).toBeVisible();\n\n  await pressFocused(page.getByRole("button", { name: /Scout.*Active turn/ }));\n  await pressFocused(page.getByRole("button", { name: "Move", exact: true }));\n\n  const scoutCell = page.locator('[data-battle-cell="0:5"]');\n  await scoutCell.focus();\n  await scoutCell.press("ArrowRight");\n  await expect(page.locator('[data-battle-cell="1:5"]')).toBeFocused();\n  await page.keyboard.press("Enter");\n  await expect(page.locator(".command-preview").getByText("Move to selected square", { exact: true })).toBeVisible();\n  await pressFocused(page.getByRole("button", { name: "Confirm move", exact: true }));\n  await expect(status).toContainText("Moved to 1, 5. 4 movement remains.");\n\n  await pressFocused(page.getByRole("button", { name: "Attack", exact: true }));\n  const movedScoutCell = page.locator('[data-battle-cell="1:5"]');\n  await movedScoutCell.focus();\n  await movedScoutCell.press("ArrowRight");\n  await expect(page.locator('[data-battle-cell="2:5"]')).toBeFocused();\n  await page.keyboard.press("Enter");\n  await expect(page.locator(".command-preview").getByText("Attack Lancer", { exact: true })).toBeVisible();\n  await pressFocused(page.getByRole("button", { name: "Confirm attack", exact: true }));\n  await expect(status).toContainText("Attack dealt 9 damage.");\n\n  await pressFocused(page.getByRole("button", { name: "End turn", exact: true }));\n  await expect(page.getByText("MC's turn", { exact: true })).toBeVisible();\n\n  const cellBox = await page.locator('[data-battle-cell="1:5"]').boundingBox();\n  expect(cellBox?.width ?? 0).toBeGreaterThanOrEqual(44);\n  expect(cellBox?.height ?? 0).toBeGreaterThanOrEqual(44);\n});\n''')
          PY
      - run: pnpm exec biome check --write --unsafe apps/web/src/battle.tsx apps/web/src/production.css tests/e2e/battle-keyboard.spec.ts
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/battle.tsx apps/web/src/production.css tests/e2e/battle-keyboard.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "GAME-UI07 add battle keyboard navigation"
          git push origin HEAD:game-ui07/battle-keyboard-nav
