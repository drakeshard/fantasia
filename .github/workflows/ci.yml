name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      web: ${{ steps.filter.outputs.web }}
      game: ${{ steps.filter.outputs.game }}
      studio: ${{ steps.filter.outputs.studio }}
      visual: ${{ steps.filter.outputs.visual }}
      story: ${{ steps.filter.outputs.story }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select required checks
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # main is the final integration gate: always execute the complete suite.
          if [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "verify=true"
              echo "web=true"
              echo "game=true"
              echo "studio=true"
              echo "visual=true"
              echo "story=true"
            } >> "$GITHUB_OUTPUT"
            echo "main push: full Quality suite selected"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"

          verify=false
          game=false
          studio=false
          visual=false
          story=false
          full=false

          for path in "${changed[@]}"; do
            # Documentation-only changes intentionally avoid dependency installation and tests.
            case "$path" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*)
                continue
                ;;
            esac

            verify=true

            # Changes to CI/toolchain/shared package plumbing are intentionally conservative.
            case "$path" in
              .github/workflows/ci.yml|.github/actions/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|biome.json|tsconfig*.json|scripts/*|patches/*|config/*|packages/*)
                full=true
                ;;
            esac

            case "$path" in
              apps/web/*|tests/e2e/*|playwright.config.ts|content/*|art/*|.github/workflows/deploy-cloudflare.yml|wrangler.jsonc)
                game=true
                ;;
            esac

            case "$path" in
              apps/content-studio/*|tests/content-studio/*|playwright.content-studio.config.ts|content/*|.github/workflows/deploy-content-studio.yml|wrangler.content-studio.jsonc)
                studio=true
                ;;
            esac

            case "$path" in
              apps/web/*|tests/visual/*|playwright.visual.config.ts|content/*|art/*|.github/workflows/deploy-cloudflare.yml|wrangler.jsonc)
                visual=true
                ;;
            esac

            case "$path" in
              apps/story-studio/*|content/*|.github/workflows/deploy-story-studio.yml|wrangler.story-studio.jsonc)
                story=true
                ;;
            esac
          done

          if [[ "$full" == "true" ]]; then
            game=true
            studio=true
            visual=true
            story=true
          fi

          web=false
          if [[ "$game" == "true" || "$visual" == "true" ]]; then
            web=true
          fi

          {
            echo "verify=$verify"
            echo "web=$web"
            echo "game=$game"
            echo "studio=$studio"
            echo "visual=$visual"
            echo "story=$story"
          } >> "$GITHUB_OUTPUT"

          echo "Selected: verify=$verify web=$web game=$game studio=$studio visual=$visual story=$story full=$full"

  verify:
    name: Fast verification
    needs: classify
    if: needs.classify.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Fantasia
        uses: ./.github/actions/setup-fantasia

      - name: Dependency audit
        run: pnpm run audit

      - name: Foundation package consumer
        run: pnpm foundation:consumer

      - name: Combined RPG/Tactical package consumer
        run: pnpm shared:consumer

      - name: Formatting, lint, architecture, and determinism
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build core packages
        run: pnpm --filter @fantasia/runtime... build

      - name: Build legacy Story Studio
        if: needs.classify.outputs.story == 'true'
        run: pnpm story:build

  web-validation:
    name: Web validation
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Fantasia
        uses: ./.github/actions/setup-fantasia

      - name: Build web surface
        run: pnpm --filter @fantasia/web build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        id: game
        if: needs.classify.outputs.game == 'true'
        continue-on-error: true
        run: pnpm test:e2e

      - name: Pre-deploy visual capture
        id: visual
        if: needs.classify.outputs.visual == 'true'
        continue-on-error: true
        run: pnpm test:visual

      - name: Upload visual review evidence
        if: always() && needs.classify.outputs.visual == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasia-visual-review-${{ github.sha }}
          path: |
            visual-artifacts/
            playwright-visual-report/
            test-results-visual/
          if-no-files-found: warn
          retention-days: 7

      - name: Require selected web suites to pass
        if: always()
        shell: bash
        env:
          GAME_SELECTED: ${{ needs.classify.outputs.game }}
          GAME_OUTCOME: ${{ steps.game.outcome }}
          VISUAL_SELECTED: ${{ needs.classify.outputs.visual }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          set -euo pipefail

          require_suite() {
            local selected="$1"
            local outcome="$2"
            local name="$3"

            if [[ "$selected" == "true" && "$outcome" != "success" ]]; then
              echo "$name was selected but finished with: $outcome"
              exit 1
            fi

            if [[ "$selected" != "true" && "$outcome" != "skipped" ]]; then
              echo "$name was not selected but unexpectedly finished with: $outcome"
              exit 1
            fi
          }

          require_suite "$GAME_SELECTED" "$GAME_OUTCOME" "Browser smoke"
          require_suite "$VISUAL_SELECTED" "$VISUAL_OUTCOME" "Visual review"

          echo "All selected web suites passed."

  content-studio-validation:
    name: Content Studio validation
    needs: classify
    if: needs.classify.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Fantasia
        uses: ./.github/actions/setup-fantasia

      - name: Build Content Studio surface
        run: pnpm --filter @fantasia/content-studio build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Content Studio primitive coverage
        run: pnpm test:content-studio

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - classify
      - verify
      - web-validation
      - content-studio-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to pass
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VERIFY_SELECTED: ${{ needs.classify.outputs.verify }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEB_SELECTED: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web-validation.result }}
          STUDIO_SELECTED: ${{ needs.classify.outputs.studio }}
          STUDIO_RESULT: ${{ needs.content-studio-validation.result }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification failed: $CLASSIFY_RESULT"
            exit 1
          fi

          require_selected() {
            local selected="$1"
            local result="$2"
            local name="$3"

            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but finished with: $result"
              exit 1
            fi

            if [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "$name was not selected but unexpectedly finished with: $result"
              exit 1
            fi
          }

          require_selected "$VERIFY_SELECTED" "$VERIFY_RESULT" "Fast verification"
          require_selected "$WEB_SELECTED" "$WEB_RESULT" "Web validation"
          require_selected "$STUDIO_SELECTED" "$STUDIO_RESULT" "Content Studio validation"

          echo "All selected Quality checks passed."
