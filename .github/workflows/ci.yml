name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Verify shared-library provenance
        run: node scripts/verify-shared-packages.mjs

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Foundation package consumer
        run: pnpm foundation:consumer

      - name: Combined RPG/Tactical package consumer
        run: pnpm shared:consumer

      - name: Formatting, lint, architecture, and determinism
        run: |
          mkdir -p visual-artifacts
          set -o pipefail
          pnpm check 2>&1 | tee visual-artifacts/quality-check.log

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm test:e2e

      - name: Pre-deploy visual capture
        run: pnpm test:visual

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasia-visual-review-${{ github.sha }}
          path: |
            visual-artifacts/
            playwright-visual-report/
            test-results-visual/
          if-no-files-found: warn
          retention-days: 7
