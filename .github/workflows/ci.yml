name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Verify shared-library provenance
        run: node scripts/verify-shared-packages.mjs

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Temporary MAP04 formatter
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx = Path('apps/web/src/map-review.tsx')
          text = tsx.read_text()
          marker = '<div class="map-review-camera-controls" aria-label="Review camera controls">'
          replacement = '<fieldset class="map-review-camera-controls"><legend class="map-review-mode-legend">Review camera controls</legend>'
          text = text.replace(marker, replacement, 1)
          start = text.index(replacement)
          close = text.index('\n          </div>\n        ) : null}', start)
          text = text[:close] + '\n          </fieldset>' + text[close + len('\n          </div>'):]
          tsx.write_text(text)

          css = Path('apps/web/src/map-review.css')
          text = css.read_text()
          text = text.replace(
              '.map-review-camera-controls {\n  display: inline-flex;\n  gap: 3px;\n  padding-left: 7px;\n  border-left: 1px solid rgb(184 197 209 / 16%);\n}',
              '.map-review-camera-controls {\n  display: inline-flex;\n  gap: 3px;\n  min-inline-size: 0;\n  margin: 0;\n  padding: 0 0 0 7px;\n  border: 0;\n  border-left: 1px solid rgb(184 197 209 / 16%);\n}',
          )
          text = text.replace(
              '\n@media (prefers-reduced-motion: reduce) {\n  .map-review * {\n    scroll-behavior: auto !important;\n  }\n}\n',
              '\n',
          )
          css.write_text(text)
          PY
          pnpm exec biome format --write apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx apps/web/src/map-review.css
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx apps/web/src/map-review.css
            git commit -m "GAME-MAP04: format review workspace"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Dependency audit
        run: pnpm audit

      - name: Foundation package consumer
        run: pnpm foundation:consumer

      - name: Combined RPG/Tactical package consumer
        run: pnpm shared:consumer

      - name: Formatting, lint, architecture, and determinism
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm test:e2e

      - name: Content Studio primitive coverage
        run: pnpm test:content-studio

      - name: Pre-deploy visual capture
        run: pnpm test:visual

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasia-visual-review-${{ github.sha }}
          path: |
            visual-artifacts/
            playwright-visual-report/
            test-results-visual/
          if-no-files-found: warn
          retention-days: 7
