name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      web: ${{ steps.filter.outputs.web }}
      game: ${{ steps.filter.outputs.game }}
      studio: ${{ steps.filter.outputs.studio }}
      visual: ${{ steps.filter.outputs.visual }}
      story: ${{ steps.filter.outputs.story }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select required checks
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t changed < <(git ls-tree -r --name-only "$HEAD_SHA")
          else
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA")
          fi

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"

          verify=false
          game=false
          studio=false
          visual=false
          story=false
          full=false

          for path in "${changed[@]}"; do
            case "$path" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*)
                continue
                ;;
            esac

            # These files define the repository-wide toolchain or Quality machinery.
            # They intentionally select every lane because their effects are cross-surface.
            case "$path" in
              .github/workflows/ci.yml|.github/actions/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|biome.json|tsconfig*.json|patches/*)
                full=true
                ;;
            esac

            # Renderer-neutral game/runtime code and its non-browser tests.
            case "$path" in
              packages/game/*|packages/runtime/*|tests/integration/*|tests/smoke/*)
                verify=true
                ;;
            esac

            # Changes to game/runtime packages can affect the player application, but not Studio.
            case "$path" in
              packages/game/*|packages/runtime/*)
                game=true
                ;;
            esac

            # Player surface and player browser tests.
            case "$path" in
              apps/web/*|tests/e2e/*|playwright.config.ts|.github/workflows/deploy-cloudflare.yml|wrangler.jsonc)
                game=true
                ;;
            esac

            # Player implementation/art changes need visual evidence; changing a visual test selects only visual.
            case "$path" in
              apps/web/*|art/*|.github/workflows/deploy-cloudflare.yml|wrangler.jsonc)
                visual=true
                ;;
              tests/visual/*|playwright.visual.config.ts)
                visual=true
                ;;
            esac

            # Content Studio is an independent application/browser surface.
            case "$path" in
              apps/content-studio/*|tests/content-studio/*|playwright.content-studio.config.ts|.github/workflows/deploy-content-studio.yml|wrangler.content-studio.jsonc|scripts/check-content-studio-deployment.mjs|scripts/check-studio-registry.mjs|scripts/check-studio-auth.mjs|scripts/check-studio-read-model.mjs|scripts/check-studio-canonical-change.mjs|scripts/generate-studio-canonical-snapshot.mjs)
                studio=true
                ;;
            esac

            # Legacy Story Studio remains independent pending its controlled retirement lane.
            case "$path" in
              apps/story-studio/*|.github/workflows/deploy-story-studio.yml|wrangler.story-studio.jsonc)
                story=true
                ;;
            esac

            # Canonical content is consumed by player, Studio, Story, and visual review.
            case "$path" in
              content/*)
                verify=true
                game=true
                studio=true
                visual=true
                story=true
                ;;
            esac

            # Runtime semantic manifest is shared between player/runtime validation and Studio publishing.
            case "$path" in
              config/runtime-assets.json)
                verify=true
                game=true
                studio=true
                ;;
            esac

            # RPG/Tactical artifact plumbing is game/core infrastructure, not Studio infrastructure.
            case "$path" in
              config/shared-library-pins.json|config/shared-library-provenance.json|scripts/prepare-shared-packages.mjs|scripts/verify-shared-packages.mjs|scripts/check-shared-consumer.mjs)
                verify=true
                game=true
                ;;
            esac

            # Other repository scripts/config affect non-browser verification only unless classified above.
            case "$path" in
              scripts/*|config/*)
                verify=true
                ;;
            esac
          done

          if [[ "$full" == "true" ]]; then
            verify=true
            game=true
            studio=true
            visual=true
            story=true
          fi

          web=false
          if [[ "$game" == "true" || "$visual" == "true" ]]; then
            web=true
          fi

          {
            echo "verify=$verify"
            echo "web=$web"
            echo "game=$game"
            echo "studio=$studio"
            echo "visual=$visual"
            echo "story=$story"
          } >> "$GITHUB_OUTPUT"

          echo "Selected: verify=$verify web=$web game=$game studio=$studio visual=$visual story=$story full=$full"

  verify:
    name: Fast verification
    needs: classify
    if: needs.classify.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Fantasia
        uses: ./.github/actions/setup-fantasia

      - name: Dependency audit
        run: pnpm run audit

      - name: Foundation package consumer
        run: pnpm foundation:consumer

      - name: Combined RPG/Tactical package consumer
        run: pnpm shared:consumer

      - name: Core formatting, architecture, determinism, assets, and backend self-test
        run: pnpm check:core

      - name: Typecheck core packages
        run: pnpm --filter @fantasia/runtime... typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build core packages
        run: pnpm --filter @fantasia/runtime... build

  web-validation:
    name: Web validation
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Fantasia
        uses: ./.github/actions/setup-fantasia

      - name: Player surface formatting
        run: pnpm check:web

      - name: Typecheck web surface
        run: pnpm --filter @fantasia/web typecheck

      - name: Build web surface
        run: pnpm --filter @fantasia/web build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        id: game
        if: needs.classify.outputs.game == 'true'
        continue-on-error: true
        run: pnpm test:e2e

      - name: Pre-deploy visual capture
        id: visual
        if: needs.classify.outputs.visual == 'true'
        continue-on-error: true
        run: pnpm test:visual

      - name: Upload visual review evidence
        if: always() && needs.classify.outputs.visual == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasia-visual-review-${{ github.sha }}
          path: |
            visual-artifacts/
            playwright-visual-report/
            test-results-visual/
          if-no-files-found: warn
          retention-days: 7

      - name: Require selected web suites to pass
        if: always()
        shell: bash
        env:
          GAME_SELECTED: ${{ needs.classify.outputs.game }}
          GAME_OUTCOME: ${{ steps.game.outcome }}
          VISUAL_SELECTED: ${{ needs.classify.outputs.visual }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          set -euo pipefail

          require_suite() {
            local selected="$1"
            local outcome="$2"
            local name="$3"

            if [[ "$selected" == "true" && "$outcome" != "success" ]]; then
              echo "$name was selected but finished with: $outcome"
              exit 1
            fi

            if [[ "$selected" != "true" && "$outcome" != "skipped" ]]; then
              echo "$name was not selected but unexpectedly finished with: $outcome"
              exit 1
            fi
          }

          require_suite "$GAME_SELECTED" "$GAME_OUTCOME" "Browser smoke"
          require_suite "$VISUAL_SELECTED" "$VISUAL_OUTCOME" "Visual review"

          echo "All selected web suites passed."

  content-studio-validation:
    name: Content Studio validation
    needs: classify
    if: needs.classify.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Content Studio
        uses: ./.github/actions/setup-fantasia
        with:
          prepare-shared: "false"

      - name: Content Studio static and contract checks
        run: pnpm check:studio

      - name: Typecheck Content Studio surface
        run: pnpm --filter @fantasia/content-studio typecheck

      - name: Build Content Studio surface
        run: pnpm --filter @fantasia/content-studio build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Content Studio browser coverage
        run: pnpm test:content-studio

  story-validation:
    name: Story Studio validation
    needs: classify
    if: needs.classify.outputs.story == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate Story Studio
        run: node apps/story-studio/build.mjs

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - classify
      - verify
      - web-validation
      - content-studio-validation
      - story-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to pass
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VERIFY_SELECTED: ${{ needs.classify.outputs.verify }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEB_SELECTED: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web-validation.result }}
          STUDIO_SELECTED: ${{ needs.classify.outputs.studio }}
          STUDIO_RESULT: ${{ needs.content-studio-validation.result }}
          STORY_SELECTED: ${{ needs.classify.outputs.story }}
          STORY_RESULT: ${{ needs.story-validation.result }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification failed: $CLASSIFY_RESULT"
            exit 1
          fi

          require_selected() {
            local selected="$1"
            local result="$2"
            local name="$3"

            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but finished with: $result"
              exit 1
            fi

            if [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "$name was not selected but unexpectedly finished with: $result"
              exit 1
            fi
          }

          require_selected "$VERIFY_SELECTED" "$VERIFY_RESULT" "Fast verification"
          require_selected "$WEB_SELECTED" "$WEB_RESULT" "Web validation"
          require_selected "$STUDIO_SELECTED" "$STUDIO_RESULT" "Content Studio validation"
          require_selected "$STORY_SELECTED" "$STORY_RESULT" "Story Studio validation"

          echo "All selected Quality checks passed."
