name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Verify shared-library provenance
        run: node scripts/verify-shared-packages.mjs

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize MAP04 camera performance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/map-review-renderer.ts')
          text = path.read_text()

          old = '''  #tapTimer: number | undefined;\n'''
          new = '''  #tapTimer: number | undefined;\n  #world: Container | undefined;\n  #fitScale = 1;\n  #contentWidth = 1;\n  #contentHeight = 1;\n  #minX = 0;\n  #minY = 0;\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''  fit(): void {\n    this.#zoom = 1;\n    this.#panX = 0;\n    this.#panY = 0;\n    this.#draw();\n  }\n'''
          new = '''  fit(): void {\n    this.#zoom = 1;\n    this.#panX = 0;\n    this.#panY = 0;\n    this.#applyCamera();\n  }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    this.#lastPointerX = event.clientX;\n    this.#lastPointerY = event.clientY;\n    this.#draw();\n  };\n'''
          new = '''    this.#lastPointerX = event.clientX;\n    this.#lastPointerY = event.clientY;\n    this.#applyCamera();\n  };\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''  #setZoom(next: number): void {\n    this.#zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next));\n    this.#draw();\n  }\n'''
          new = '''  #setZoom(next: number): void {\n    this.#zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next));\n    this.#applyCamera();\n  }\n\n  #applyCamera(): void {\n    this.#updateCameraDataset();\n    const world = this.#world;\n    if (!world) return;\n    const scale = this.#fitScale * this.#zoom;\n    world.scale.set(scale);\n    world.x =\n      (this.#app.screen.width - this.#contentWidth * scale) / 2 +\n      (PADDING - this.#minX) * scale +\n      this.#panX;\n    world.y =\n      (this.#app.screen.height - this.#contentHeight * scale) / 2 +\n      (PADDING - this.#minY) * scale +\n      this.#panY;\n  }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    const contentWidth = maxX - minX + PADDING * 2;\n    const contentHeight = maxY - minY + PADDING * 2;\n    const fitScale = Math.min(\n      1.3,\n      Math.max(\n        0.32,\n        Math.min(this.#app.screen.width / contentWidth, this.#app.screen.height / contentHeight),\n      ),\n    );\n    const scale = fitScale * this.#zoom;\n    const world = new Container();\n    world.scale.set(scale);\n    world.x =\n      (this.#app.screen.width - contentWidth * scale) / 2 + (PADDING - minX) * scale + this.#panX;\n    world.y =\n      (this.#app.screen.height - contentHeight * scale) / 2 + (PADDING - minY) * scale + this.#panY;\n    this.#app.stage.addChild(world);\n'''
          new = '''    this.#contentWidth = maxX - minX + PADDING * 2;\n    this.#contentHeight = maxY - minY + PADDING * 2;\n    this.#minX = minX;\n    this.#minY = minY;\n    this.#fitScale = Math.min(\n      1.3,\n      Math.max(\n        0.32,\n        Math.min(\n          this.#app.screen.width / this.#contentWidth,\n          this.#app.screen.height / this.#contentHeight,\n        ),\n      ),\n    );\n    const world = new Container();\n    this.#world = world;\n    this.#app.stage.addChild(world);\n    this.#applyCamera();\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text)

          path = Path('apps/web/src/map-review.tsx')
          text = path.read_text()
          old = '  const [detailsOpen, setDetailsOpen] = useState(true);'
          new = '''  const [detailsOpen, setDetailsOpen] = useState(\n    () => window.innerWidth >= 1000 && window.innerHeight >= 600,\n  );'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          pnpm exec biome format --write apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx
            git commit -m "GAME-MAP04: optimize review camera transforms"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Dependency audit
        run: pnpm audit

      - name: Foundation package consumer
        run: pnpm foundation:consumer

      - name: Combined RPG/Tactical package consumer
        run: pnpm shared:consumer

      - name: Formatting, lint, architecture, and determinism
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm test:e2e

      - name: Content Studio primitive coverage
        run: pnpm test:content-studio

      - name: Pre-deploy visual capture
        run: pnpm test:visual

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasia-visual-review-${{ github.sha }}
          path: |
            visual-artifacts/
            playwright-visual-report/
            test-results-visual/
          if-no-files-found: warn
          retention-days: 7
