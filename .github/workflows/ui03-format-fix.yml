name: GAME-UI03 Formatting Repair

on:
  push:
    branches:
      - game-ui03/standardized-battle-hud
    paths:
      - .github/workflows/ui03-format-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui03/standardized-battle-hud
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Repair lint and format touched files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/production.css')
          text = path.read_text().replace('color: var(--ui-accent) !important;', 'color: var(--ui-accent);')
          path.write_text(text)
          path = Path('apps/web/src/styles.css')
          text = path.read_text()
          text = text.replace('scroll-behavior: auto !important;', 'scroll-behavior: auto;')
          text = text.replace('transition-duration: 0.001ms !important;', 'transition-duration: 0.001ms;')
          text = text.replace('animation-duration: 0.001ms !important;', 'animation-duration: 0.001ms;')
          text = text.replace('animation-iteration-count: 1 !important;', 'animation-iteration-count: 1;')
          path.write_text(text)
          PY
          pnpm exec biome check --write apps/web/src/main.tsx apps/web/src/styles.css apps/web/src/production.css tests/e2e/bootstrap.spec.ts playwright.config.ts
          pnpm exec biome check apps/web/src/main.tsx apps/web/src/styles.css apps/web/src/production.css tests/e2e/bootstrap.spec.ts playwright.config.ts
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/styles.css apps/web/src/production.css tests/e2e/bootstrap.spec.ts playwright.config.ts
          git commit -m "GAME-UI03 apply repository formatting" || exit 0
          git push origin HEAD:game-ui03/standardized-battle-hud
