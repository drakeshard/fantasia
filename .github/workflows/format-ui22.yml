name: Format GAME-UI22

on:
  push:
    branches:
      - game-ui22-talent-menu

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui22-talent-menu
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format GAME-UI22"
          git push origin HEAD:game-ui22-talent-menu
