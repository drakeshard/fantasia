name: Temp Format NAR03

on:
  push:
    branches:
      - game-nar03/n01-conversation
    paths:
      - .github/workflows/temp-format-nar03.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-nar03/n01-conversation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Format NAR03 files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const storyPath = 'content/narrative/story.json';
          const story = JSON.parse(readFileSync(storyPath, 'utf8'));
          writeFileSync(storyPath, `${JSON.stringify(story, null, 2)}\n`);

          const appPath = 'apps/story-studio/src/app.js';
          let app = readFileSync(appPath, 'utf8');
          app = app.replace(
            '    absoluteIndex += scriptForBeat(priorBeat).length || (productionForBeat(priorBeat)?.events?.length ?? 1);',
            '    absoluteIndex +=\n      scriptForBeat(priorBeat).length || (productionForBeat(priorBeat)?.events?.length ?? 1);',
          );
          writeFileSync(appPath, app);
          NODE
      - name: Commit formatting
        run: |
          git config user.name "drakeshard-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/narrative/story.json apps/story-studio/src/app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply NAR03 formatting"
          git push origin HEAD:game-nar03/n01-conversation
