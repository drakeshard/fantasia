name: GAME-UI06 click fix

on:
  push:
    branches:
      - game-ui06/campaign-map-input

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui06/campaign-map-input
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Bind drag click suppression to the originating pointer gesture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/campaign.tsx")
          text = path.read_text()
          text = text.replace(
              '''    if (!viewport) return;\n    pointers.current.set(event.pointerId, { x: event.clientX, y: event.clientY });''',
              '''    if (!viewport) return;\n    if (pointers.current.size == 0) suppressClick.current = false;\n    pointers.current.set(event.pointerId, { x: event.clientX, y: event.clientY });''',
              1,
          )
          text = text.replace(
              '''    if (drag?.pointerId === event.pointerId && drag.moved) {\n      suppressClick.current = true;\n      setTimeout(() => {\n        suppressClick.current = false;\n      }, 0);\n    }''',
              '''    if (drag?.pointerId === event.pointerId && drag.moved) {\n      suppressClick.current = true;\n    }''',
              1,
          )
          path.write_text(text)
          PY
      - run: pnpm exec biome check --write --unsafe apps/web/src/campaign.tsx
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/campaign.tsx
          git commit -m "fix: scope drag click suppression to one pointer gesture"
          git push origin HEAD:game-ui06/campaign-map-input
