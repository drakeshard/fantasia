name: STUDIO04 Final Format

on:
  push:
    branches:
      - game-studio04/canonical-git-proposals

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-studio04/canonical-git-proposals
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm biome check --write \
            scripts/check-studio-auth.mjs \
            supabase/functions/studio-operations/github-proposals.ts || true
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-studio-auth.mjs supabase/functions/studio-operations/github-proposals.ts
          git commit -m "chore(studio): format final STUDIO04 files"
          git push origin HEAD:game-studio04/canonical-git-proposals
