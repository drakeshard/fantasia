name: Deploy Story Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-story-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require main deployment ref
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production deployment must be dispatched from main; received $GITHUB_REF"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Build Story Studio
        run: node apps/story-studio/build.mjs

      - name: Deploy Story Studio
        run: pnpm dlx wrangler@4.148.0 deploy --config wrangler.story-studio.jsonc
