name: UI25 Format Assist

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format UI25 files
        run: |
          pnpm exec biome format --write apps/web/src/fantasia-v2.css apps/web/src/fantasia-v2-structure.css apps/web/src/styles.css apps/web/src/ui/tokens.css apps/web/src/ui/primitives.css apps/web/src/ui24e1-auth-home.css apps/web/src/ui24e2-saga-chapter.css apps/web/src/ui24e3-story-characters-talent.css apps/web/src/ui24e3-talent-compact-fit.css apps/web/src/ui24e4-settings.css apps/web/src/ui24e5-battle-hud.css apps/web/src/ui24e5-battle-hud-fixes.css
          sed -i 's/ !important//g' apps/web/src/fantasia-v2.css
          pnpm exec biome format --write apps/web/src/fantasia-v2.css
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: canonicalize GAME-UI25 CSS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
