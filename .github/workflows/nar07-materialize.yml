name: NAR07 Materialize

on:
  push:
    branches:
      - game-nar07/ch02-ch03-draft

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-nar07/ch02-ch03-draft

      - name: Append Chapter 2 and Chapter 3 narrative
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const storyPath = 'content/narrative/story.json';
          const productionPath = 'content/narrative/story-production.json';
          const story = JSON.parse(fs.readFileSync(storyPath, 'utf8'));
          const production = JSON.parse(fs.readFileSync(productionPath, 'utf8'));
          const saga = story.sagas.find((entry) => entry.id === 'S01');
          if (!saga) throw new Error('S01 not found');
          if (saga.chapters.some((chapter) => chapter.id === 'CH02' || chapter.id === 'CH03')) {
            throw new Error('CH02/CH03 already exist');
          }

          const d = (id, text, speaker, displayLabel) => ({ id, type: 'dialogue', text, speaker, displayLabel });
          const a = (id, text) => ({ id, type: 'action', text });
          const c = (id, text) => ({ id, type: 'control', text });
          const t = (id, text) => ({ id, type: 'transition', text });
          const n = (id, text) => ({ id, type: 'narration', text });
          const beat = (id, order, title, presentation, characters, screenAction, dialogueIntent, playerControl, trigger, result, next, script) => ({
            id, order, title, presentation, characters, screenAction, dialogueIntent, playerControl, trigger, result, next, scriptStatus: 'draft', script,
          });
          const node = (id, title, type, summary, beats, extra = {}) => ({
            id, title, type, status: 'approved-structure', scriptStatus: 'draft', ...extra, summary, beats,
          });
          const draftNode = (id, title, type, summary, beats, extra = {}) => ({
            id, title, type, status: 'draft', scriptStatus: 'draft', ...extra, summary, beats,
          });

          const ch02 = {
            id: 'CH02',
            title: 'The Siege of Orléans',
            status: 'approved-structure',
            nodes: [
              node('CH02-N01', 'Behind the Walls', 'story',
                'MC enters Orléans and sees the siege as an exhausted civilian and military crisis rather than a heroic legend. Dunois becomes the command anchor while MC still searches for answers about home.', [
                  beat('CH02-N01-BEAT-01', 1, 'A City Still Standing', 'story-scene', ['MC','Julie d’Aubigny','Hangaku Gozen','La Hire','Jean de Dunois'],
                    'The group enters Orléans through crowded defenses, wounded soldiers, damaged streets, ration lines, and hurried messengers.',
                    'Ground the city before Jeanne appears. Dunois should read as capable and overburdened, not ceremonial.', 'dialogue advance', 'chapter_start',
                    'MC understands that Orléans is surviving under pressure and gains access to the local command network without becoming politically committed.', 'CH02-N02', [
                      a('S01-CH02-N01-L010','Orléans is loud with hammering, carts, bells, wounded men, and people arguing over food.'),
                      d('S01-CH02-N01-L020','This is what everyone was trying to reach?','MC','MC'),
                      d('S01-CH02-N01-L030','This is what is left of it after months of siege.','La Hire','La Hire'),
                      a('S01-CH02-N01-L040','A tired commander crosses the street while giving three different orders without slowing.'),
                      d('S01-CH02-N01-L050','La Hire. You brought more mouths.','Jean de Dunois','Dunois'),
                      d('S01-CH02-N01-L060','I brought people who can keep them attached to their bodies.','La Hire','La Hire'),
                      d('S01-CH02-N01-L070','Then I can use them. Jean de Dunois.','Jean de Dunois','Dunois'),
                      d('S01-CH02-N01-L080','{{MC_NAME}}. I was hoping somebody here had maps of places no one else has heard of.','MC','MC'),
                      d('S01-CH02-N01-L090','If your place exists on a map, we will look after we survive the week.','Jean de Dunois','Dunois'),
                      t('S01-CH02-N01-L100','CH02-N02 — The Maid Enters Orléans.')
                    ])
                ], { location: 'Orléans', time: '29 April 1429 — afternoon' }),

              node('CH02-N02', 'The Maid Enters Orléans', 'story',
                'Jeanne enters Orléans as a public symbol before MC meets her privately. The city projects hope and expectation onto a young woman MC can barely see through the crowd.', [
                  beat('CH02-N02-BEAT-01', 1, 'The Maid', 'cinematic', ['MC','Julie d’Aubigny','Hangaku Gozen','La Hire','Jeanne d’Arc','Civilians'],
                    'Crowds gather as Jeanne enters the city. MC sees banners, armor, and a young rider almost swallowed by the reaction around her.',
                    'Keep Jeanne distant and human inside the spectacle. Do not validate prophecy or explain miracles.', 'dialogue advance', 'maid_arrival',
                    'MC understands why the rumor mattered to Orléans, but still knows Jeanne only as the Maid seen by everyone else.', 'CH02-N03', [
                      a('S01-CH02-N02-L010','A wave of shouting rolls down the street before MC can see its cause.'),
                      d('S01-CH02-N02-L020','What happened?','MC','MC'),
                      d('S01-CH02-N02-L030','She made it into the city.','Civilian','Civilian'),
                      d('S01-CH02-N02-L040','The Maid?','MC','MC'),
                      a('S01-CH02-N02-L050','A white banner rises above the crowd. Beneath it rides a young armored woman, visibly tired and trying to acknowledge everyone at once.'),
                      d('S01-CH02-N02-L060','They look at her like the siege is already over.','Julie d’Aubigny','Julie'),
                      d('S01-CH02-N02-L070','That is a dangerous amount of hope to put on one person.','Hangaku Gozen','Hangaku Gozen'),
                      a('S01-CH02-N02-L080','The crowd closes and Jeanne disappears from view.'),
                      t('S01-CH02-N02-L090','CH02-N03 — Beneath the Banner.')
                    ])
                ], { location: 'Orléans', time: '29 April 1429 — evening' }),

              node('CH02-N03', 'Beneath the Banner', 'story',
                'MC meets Jeanne directly at human scale. Bradamante also enters the Orléans group as a disciplined armored lancer, while the coming Saint-Loup assault pulls everyone toward the same immediate problem.', [
                  beat('CH02-N03-BEAT-01', 1, 'Jeanne the Person', 'character-scene', ['MC','Julie d’Aubigny','Jeanne d’Arc','Jean de Dunois','Bradamante'],
                    'Away from the crowd, MC finds Jeanne eating quickly over a campaign table while Dunois reviews positions. Bradamante stands among the arriving fighters.',
                    'Make Jeanne serious, young, tired, and direct. Her first bond with MC comes from recognizing another person who does not know what comes next.', 'dialogue advance', 'private_meeting',
                    'MC and Jeanne meet as people before fighting together; Bradamante is established as a new allied lancer for the coming assault.', 'CH02-B01', [
                      a('S01-CH02-N03-L010','The room is quieter than the street. Jeanne is halfway through a piece of bread when Dunois points MC toward the table.'),
                      d('S01-CH02-N03-L020','This is the stranger from the eastern road.','Jean de Dunois','Dunois'),
                      d('S01-CH02-N03-L030','I have a name.','MC','MC'),
                      d('S01-CH02-N03-L040','Good. So do I. Jeanne.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-N03-L050','I know. Half the city has been shouting it.','MC','MC'),
                      a('S01-CH02-N03-L060','Jeanne almost smiles, then looks back at the marked positions outside the walls.'),
                      d('S01-CH02-N03-L070','They want me to know what happens next.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-N03-L080','Do you?','MC','MC'),
                      d('S01-CH02-N03-L090','I know what I am going to try. That has to be enough.','Jeanne d’Arc','Jeanne'),
                      a('S01-CH02-N03-L100','An armored lancer sets a helm beside the table.'),
                      d('S01-CH02-N03-L110','Bradamante. If Saint-Loup is the road forward, I will take it with you.','Bradamante','Bradamante'),
                      c('S01-CH02-N03-L120','Draft battle-party intent: Bradamante enters as an allied Lancer; La Hire provides the first clear Cavalry guest role for the siege offensives.'),
                      t('S01-CH02-N03-L130','CH02-B01 — Saint-Loup.')
                    ])
                ], { location: 'Orléans command quarters', time: 'Early May 1429' }),

              node('CH02-B01', 'Saint-Loup', 'battle',
                'The first full siege offensive attacks Saint-Loup. MC fights as a functioning participant while Jeanne, La Hire, Bradamante, and the French force break an English outer position.', [
                  beat('CH02-B01-BEAT-01', 1, 'Take the Bastille', 'battle-preview', ['MC','Jeanne d’Arc','La Hire','Bradamante','English defenders'],
                    'French forces assault Saint-Loup under missile pressure and fortified resistance. La Hire uses mounted mobility around the approach while Bradamante opens safe pressure lanes for infantry.',
                    'This is MC’s first battle entered willingly as a fighter in France. Keep the objective positional: breach and secure, not simple annihilation.', 'battle control', 'saint_loup_assault',
                    'The attackers breach Saint-Loup and force the defense to collapse.', 'CH02-B01-BEAT-02', [
                      c('S01-CH02-B01-L010','Objective: breach the Saint-Loup defenses and secure the inner position.'),
                      d('S01-CH02-B01-L020','Do not bunch under the arrows! Keep moving!','Jean de Dunois','Dunois'),
                      a('S01-CH02-B01-L030','La Hire rides hard across the exposed approach, forcing defenders to split their attention.'),
                      d('S01-CH02-B01-L040','There. That gap.','Bradamante','Bradamante'),
                      d('S01-CH02-B01-L050','I see it.','MC','MC'),
                      a('S01-CH02-B01-L060','MC advances with the assault instead of staying behind the civilians for the first time.'),
                      d('S01-CH02-B01-L070','With me!','Jeanne d’Arc','Jeanne')
                    ]),
                  beat('CH02-B01-BEAT-02', 2, 'After the Breach', 'battle-event', ['MC','Jeanne d’Arc','Julie d’Aubigny','French soldiers'],
                    'The position falls. The immediate triumph is undercut by wounded soldiers and prisoners in the captured works.',
                    'Do not turn the victory into a clean heroic tableau. Set up N05 by showing the human cost immediately.', 'battle control / dialogue advance', 'saint_loup_secured',
                    'Saint-Loup is secured and the group returns to Orléans with a more complicated sense of victory.', 'CH02-N05', [
                      a('S01-CH02-B01-L080','The last organized resistance inside the position breaks.'),
                      c('S01-CH02-B01-L090','Battle objective complete: Saint-Loup secured.'),
                      a('S01-CH02-B01-L100','Cheers rise, then thin as the wounded are carried past.'),
                      d('S01-CH02-B01-L110','We won.','MC','MC'),
                      d('S01-CH02-B01-L120','Yes.','Julie d’Aubigny','Julie'),
                      d('S01-CH02-B01-L130','You do not sound happy.','MC','MC'),
                      d('S01-CH02-B01-L140','I am. I just know what it cost.','Julie d’Aubigny','Julie'),
                      t('S01-CH02-B01-L150','CH02-N05 — The Cost of Hope.')
                    ])
                ]),

              node('CH02-N05', 'The Cost of Hope', 'story',
                'After Saint-Loup, MC and Jeanne compare what it means to help people when one is already being treated as a hero and the other still does not believe the word applies.', [
                  beat('CH02-N05-BEAT-01', 1, 'Heroes', 'character-scene', ['MC','Jeanne d’Arc','Julie d’Aubigny'],
                    'MC helps carry supplies among the wounded. Jeanne joins briefly after escaping another cluster of people demanding answers from her.',
                    'Build the MC–Jeanne relationship through shared discomfort with the idea of heroism, not romance or prophecy.', 'dialogue advance', 'after_saint_loup',
                    'Jeanne sees that MC keeps helping without needing a grand reason; MC sees how exhausting it is to be treated as everyone’s answer.', 'CH02-B02', [
                      a('S01-CH02-N05-L010','MC stacks water beside the wounded while Jeanne finally slips away from a knot of officers and civilians.'),
                      d('S01-CH02-N05-L020','Do they ever stop asking you what to do?','MC','MC'),
                      d('S01-CH02-N05-L030','No.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-N05-L040','That sounds terrible.','MC','MC'),
                      d('S01-CH02-N05-L050','It is also why they keep moving.','Jeanne d’Arc','Jeanne'),
                      a('S01-CH02-N05-L060','Jeanne watches MC hand a cup of water to a wounded soldier.'),
                      d('S01-CH02-N05-L070','You do that often.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-N05-L080','What?','MC','MC'),
                      d('S01-CH02-N05-L090','Help first. Decide what it means later.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-N05-L100','Julie says that is how I get into trouble.','MC','MC'),
                      d('S01-CH02-N05-L110','Then perhaps she is right.','Jeanne d’Arc','Jeanne'),
                      t('S01-CH02-N05-L120','CH02-B02 — Across the Loire / The Augustins.')
                    ])
                ]),

              node('CH02-B02', 'Across the Loire / The Augustins', 'battle',
                'The campaign shifts across the Loire toward fortified positions around the Augustins. Mobility, crossings, and separated fronts become more important than the Saint-Loup assault.', [
                  beat('CH02-B02-BEAT-01', 1, 'Across the River', 'battle-preview', ['MC','Jeanne d’Arc','La Hire','Bradamante','Hangaku Gozen','English defenders'],
                    'The force crosses and reorganizes under fire. La Hire’s mounted movement connects separated pressure points while Hangaku and Bradamante keep the crossing from collapsing.',
                    'Escalate from a single fortress assault into coordinated movement across constrained approaches.', 'battle control', 'loire_crossing',
                    'The French force establishes the attack and drives toward the Augustins position.', 'CH02-B02-BEAT-02', [
                      c('S01-CH02-B02-L010','Objective: establish the crossing, protect the route, and open the approach to the Augustins.'),
                      d('S01-CH02-B02-L020','If that crossing closes, half of us fight alone.','Hangaku Gozen','Hangaku Gozen'),
                      d('S01-CH02-B02-L030','Then keep it open. I will carry orders between the fronts.','La Hire','La Hire'),
                      a('S01-CH02-B02-L040','La Hire wheels away before anyone can answer.'),
                      d('S01-CH02-B02-L050','Does he always do that?','MC','MC'),
                      d('S01-CH02-B02-L060','Yes.','Julie d’Aubigny','Julie'),
                      d('S01-CH02-B02-L070','Unfortunately.','Bradamante','Bradamante')
                    ]),
                  beat('CH02-B02-BEAT-02', 2, 'The Augustins Break', 'battle-event', ['MC','Jeanne d’Arc','French soldiers','English defenders'],
                    'After sustained pressure the Augustins position gives way and the route toward the Tourelles becomes the next unavoidable objective.',
                    'End with momentum but visible exhaustion. The Tourelles should feel harder, not like a victory lap.', 'battle control', 'augustins_breached',
                    'The Augustins fall and the assault line turns toward the Tourelles.', 'CH02-B03', [
                      a('S01-CH02-B02-L080','The defenders begin pulling back from the broken position.'),
                      c('S01-CH02-B02-L090','Objective complete: Augustins position taken.'),
                      d('S01-CH02-B02-L100','They are falling back.','MC','MC'),
                      d('S01-CH02-B02-L110','Toward the Tourelles.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-B02-L120','Then we are not finished.','MC','MC'),
                      d('S01-CH02-B02-L130','No.','Jeanne d’Arc','Jeanne'),
                      t('S01-CH02-B02-L140','CH02-B03 — The Tourelles.')
                    ])
                ]),

              node('CH02-B03', 'The Tourelles', 'battle',
                'The siege climax assaults the Tourelles. Jeanne is wounded, morale falters, and the objective honestly shifts to preventing collapse before she returns bandaged and the final assault resumes.', [
                  beat('CH02-B03-BEAT-01', 1, 'The Wound', 'battle-event', ['MC','Jeanne d’Arc','Julie d’Aubigny','La Hire','Bradamante','French soldiers'],
                    'During the assault Jeanne is wounded and removed from the immediate line. The attack stalls as soldiers react to seeing the symbol of their hope fall.',
                    'Treat the wound as dangerous and frightening. No miraculous healing.', 'battle control', 'tourelles_assault_midpoint',
                    'The battle objective changes from assault to hold/protect/reorganize while Jeanne is treated.', 'CH02-B03-BEAT-02', [
                      a('S01-CH02-B03-L010','The assault compresses against the fortifications under heavy fire.'),
                      a('S01-CH02-B03-L020','Jeanne jerks backward and falls among the front ranks.'),
                      d('S01-CH02-B03-L030','Jeanne!','MC','MC'),
                      d('S01-CH02-B03-L040','Get her back! Now!','Julie d’Aubigny','Julie'),
                      c('S01-CH02-B03-L050','Objective changes: HOLD THE LINE. Protect the wounded, prevent a rout, and keep the assault route from collapsing.'),
                      d('S01-CH02-B03-L060','Nobody runs. Not one step!','La Hire','La Hire'),
                      a('S01-CH02-B03-L070','Jeanne is carried away from the immediate fighting for treatment.')
                    ]),
                  beat('CH02-B03-BEAT-02', 2, 'Return to the Line', 'battle-preview', ['MC','Jeanne d’Arc','Julie d’Aubigny','French soldiers','English defenders'],
                    'After the line stabilizes, Jeanne returns visibly bandaged and insists on continuing. Morale recovers because the soldiers see her return, not because the wound disappears.',
                    'The final push belongs to the whole force. Jeanne restores morale; the player completes the tactical objective.', 'battle control', 'line_stabilized',
                    'The final assault succeeds and the siege position collapses.', 'CH02-N08', [
                      a('S01-CH02-B03-L080','The line holds long enough for the panic to stop spreading.'),
                      a('S01-CH02-B03-L090','A murmur begins behind the front.'),
                      a('S01-CH02-B03-L100','Jeanne returns with the wound bound tightly, pale but standing.'),
                      d('S01-CH02-B03-L110','You should be lying down.','MC','MC'),
                      d('S01-CH02-B03-L120','Later.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH02-B03-L130','That is a terrible answer.','MC','MC'),
                      d('S01-CH02-B03-L140','It is the one I have.','Jeanne d’Arc','Jeanne'),
                      c('S01-CH02-B03-L150','Objective update: resume the final assault and secure the Tourelles.'),
                      a('S01-CH02-B03-L160','The French line surges forward again.'),
                      t('S01-CH02-B03-L170','The Tourelles position falls. CH02-N08 — The Siege Is Lifted.')
                    ])
                ], { location: 'Tourelles, Orléans', time: '7 May 1429' }),

              node('CH02-N08', 'The Siege Is Lifted', 'story',
                'The English withdrawal resolves the siege without another mandatory battle. Orléans celebrates, while MC realizes the people here are no longer merely strangers between them and home.', [
                  beat('CH02-N08-BEAT-01', 1, 'Eight Days of May', 'chapter-end', ['MC','Julie d’Aubigny','Jeanne d’Arc','Hangaku Gozen','La Hire','Bradamante','Jean de Dunois'],
                    'The city wakes to the English withdrawal and erupts into exhausted celebration. MC still has no map to Vaelkrath, but now has relationships they are unwilling to treat as temporary inconveniences.',
                    'End on emotional attachment and the next campaign direction, not on a solved world mystery.', 'dialogue advance', 'siege_lifted',
                    'Chapter 2 ends with the siege lifted and the route toward the Loire campaign / crown becoming the next story movement.', 'CH03', [
                      a('S01-CH02-N08-L010','Church bells answer each other across Orléans. People spill into streets that were defensive positions the day before.'),
                      d('S01-CH02-N08-L020','They are leaving.','Jean de Dunois','Dunois'),
                      d('S01-CH02-N08-L030','The English?','MC','MC'),
                      d('S01-CH02-N08-L040','The siege. It is over.','Jean de Dunois','Dunois'),
                      a('S01-CH02-N08-L050','MC looks at Julie, Hangaku, La Hire, Bradamante, and finally Jeanne.'),
                      d('S01-CH02-N08-L060','I still do not know how to get home.','MC','MC'),
                      d('S01-CH02-N08-L070','I know.','Julie d’Aubigny','Julie'),
                      d('S01-CH02-N08-L080','But?','MC','MC'),
                      d('S01-CH02-N08-L090','But you are not leaving today.','Julie d’Aubigny','Julie'),
                      d('S01-CH02-N08-L100','No. I guess I am not.','MC','MC'),
                      d('S01-CH02-N08-L110','There is another road now. The Loire first. Then Reims.','Jeanne d’Arc','Jeanne'),
                      n('S01-CH02-N08-L120','CHAPTER 2 COMPLETE'),
                      t('S01-CH02-N08-L130','Next: Chapter 3 — The Road to the Crown.')
                    ])
                ], { location: 'Orléans', time: '8 May 1429' })
            ]
          };

          const ch03 = {
            id: 'CH03',
            title: 'The Road to the Crown',
            status: 'draft',
            nodes: [
              draftNode('CH03-N01', 'Beyond Orléans', 'story',
                'After the siege, the campaign turns from saving one city toward opening the Loire and carrying Charles toward Reims. Jean II d’Alençon becomes a central campaign commander while MC chooses to keep traveling with Jeanne.', [
                  beat('CH03-N01-BEAT-01', 1, 'A Larger Road', 'story-scene', ['MC','Jeanne d’Arc','Julie d’Aubigny','Jean II d’Alençon','La Hire'],
                    'The party leaves the immediate Orléans crisis behind and joins a larger campaign moving along the Loire. Alençon frames the next operations as a military road toward the king’s coronation.',
                    'Expand the political scale without making MC suddenly care about dynastic legitimacy more than people.', 'dialogue advance', 'chapter_start',
                    'MC commits to the next leg because Jeanne and the group are going, while the road to Reims becomes the chapter goal.', 'CH03-B01', [
                      a('S01-CH03-N01-L010','The walls of Orléans recede behind a column of soldiers, carts, horses, and banners.'),
                      d('S01-CH03-N01-L020','I thought winning Orléans meant we could rest.','MC','MC'),
                      d('S01-CH03-N01-L030','It meant we could start moving.','Jean II d’Alençon','Alençon'),
                      d('S01-CH03-N01-L040','Jean d’Alençon. We clear the Loire, then the road to Reims becomes possible.','Jean II d’Alençon','Alençon'),
                      d('S01-CH03-N01-L050','And the crown.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH03-N01-L060','You really intend to go all the way.','MC','MC'),
                      d('S01-CH03-N01-L070','Yes.','Jeanne d’Arc','Jeanne'),
                      d('S01-CH03-N01-L080','Then I am coming too.','MC','MC'),
                      t('S01-CH03-N01-L090','CH03-B01 — Jargeau.')
                    ])
                ], { location: 'Loire campaign route', time: 'June 1429' }),

              draftNode('CH03-B01', 'Jargeau', 'battle',
                'The campaign attacks Jargeau. William de la Pole, Earl of Suffolk, anchors the English defense as the French push from siege assault into open campaign warfare.', [
                  beat('CH03-B01-BEAT-01', 1, 'Break Jargeau', 'battle-preview', ['MC','Jeanne d’Arc','Jean II d’Alençon','La Hire','William de la Pole, Earl of Suffolk'],
                    'The French assault Jargeau against determined English resistance under Suffolk.',
                    'Make the battle a disciplined escalation from Orléans rather than another miraculous charge. Suffolk should read as a serious commander, not a disposable villain.', 'battle control', 'jargeau_assault',
                    'Jargeau falls and Suffolk is taken out of the campaign, opening the next Loire positions.', 'CH03-N03', [
                      c('S01-CH03-B01-L010','Objective: breach Jargeau and force the English garrison to surrender or collapse.'),
                      d('S01-CH03-B01-L020','They have momentum. Break it here.','William de la Pole, Earl of Suffolk','Suffolk'),
                      d('S01-CH03-B01-L030','He knows what he is doing.','MC','MC'),
                      d('S01-CH03-B01-L040','Good. Then beating him will matter.','Jean II d’Alençon','Alençon'),
                      a('S01-CH03-B01-L050','The French push through the defenses in successive waves instead of a single rush.'),
                      d('S01-CH03-B01-L060','Forward! Keep the pressure!','Jeanne d’Arc','Jeanne'),
                      a('S01-CH03-B01-L070','By the battle’s end, organized resistance at Jargeau has collapsed and Suffolk is captured.'),
                      t('S01-CH03-B01-L080','The Loire campaign continues west. CH03-N03 — Between Fortresses.')
                    ])
                ], { location: 'Jargeau', time: '12 June 1429' }),

              draftNode('CH03-N03', 'Between Fortresses', 'story',
                'The campaign moves through the Loire positions around Meung and Beaugency. Arthur de Richemont’s arrival creates political friction even as his strength helps pressure the English position.', [
                  beat('CH03-N03-BEAT-01', 1, 'An Ally Nobody Invited', 'story-scene', ['MC','Jeanne d’Arc','Jean II d’Alençon','Arthur de Richemont','La Hire'],
                    'As Beaugency comes under pressure, Richemont arrives with Breton strength despite political distrust around him.',
                    'Use Richemont to show that allies can be politically inconvenient. MC should understand the personal tension before the dynastic details.', 'dialogue advance', 'richemont_arrives',
                    'The campaign accepts Richemont’s practical help, but the political fracture inside the French side becomes visible to MC.', 'CH03-B02', [
                      a('S01-CH03-N03-L010','A fresh column approaches under Breton banners while officers around Alençon react with more suspicion than relief.'),
                      d('S01-CH03-N03-L020','Those are ours, yes?','MC','MC'),
                      d('S01-CH03-N03-L030','That depends which argument you are asking about.','La Hire','La Hire'),
                      d('S01-CH03-N03-L040','Arthur de Richemont. I brought soldiers, not a debate.','Arthur de Richemont','Richemont'),
                      d('S01-CH03-N03-L050','For today, soldiers are useful.','Jean II d’Alençon','Alençon'),
                      d('S01-CH03-N03-L060','That may be the kindest welcome I receive.','Arthur de Richemont','Richemont'),
                      a('S01-CH03-N03-L070','The army turns its attention back toward the English withdrawal and the road beyond Beaugency.'),
                      t('S01-CH03-N03-L080','CH03-B02 — Patay.')
                    ])
                ], { location: 'Loire valley — Meung / Beaugency approaches', time: 'Mid-June 1429' }),

              draftNode('CH03-B02', 'Patay', 'battle',
                'The French catch the retreating English near Patay. La Hire’s vanguard becomes central, while John Talbot’s disciplined reputation makes the sudden English collapse feel consequential rather than easy.', [
                  beat('CH03-B02-BEAT-01', 1, 'Before the Line Sets', 'battle-preview', ['MC','La Hire','Jean II d’Alençon','John Talbot','French vanguard','English army'],
                    'The French discover the English before their defensive deployment is fully settled and attack the vulnerable formation.',
                    'This battle should feel fast, dangerous, and opportunity-driven. Talbot is formidable, but the English position is caught at the wrong moment.', 'battle control', 'patay_contact',
                    'The French vanguard breaks the English field position before it can stabilize.', 'CH03-B02-BEAT-02', [
                      c('S01-CH03-B02-L010','Objective: strike before the English line fully forms; prevent an organized withdrawal.'),
                      d('S01-CH03-B02-L020','Now! Do not give them time to plant themselves!','La Hire','La Hire'),
                      a('S01-CH03-B02-L030','Mounted French forces surge toward the incomplete English position.'),
                      d('S01-CH03-B02-L040','Hold the line!','John Talbot','Talbot'),
                      d('S01-CH03-B02-L050','That one is not running.','MC','MC'),
                      d('S01-CH03-B02-L060','Talbot. He rarely does.','Jean II d’Alençon','Alençon')
                    ]),
                  beat('CH03-B02-BEAT-02', 2, 'A Commander Captured', 'post-battle', ['MC','John Talbot','La Hire','Jeanne d’Arc'],
                    'The English field force collapses and Talbot is captured. MC sees that a famous enemy can lose because conditions, timing, and people failed around him—not because history guarantees it.',
                    'Let Talbot retain dignity and danger in defeat. This is useful groundwork for his later importance.', 'dialogue advance', 'patay_won',
                    'Patay opens the road toward Reims and establishes Talbot as a major opposing figure rather than a one-battle enemy.', 'CH03-N05', [
                      a('S01-CH03-B02-L070','The English formation breaks into retreat and surrender.'),
                      a('S01-CH03-B02-L080','Talbot is brought under guard, furious but composed.'),
                      d('S01-CH03-B02-L090','You caught an army before it was ready. Do not mistake that for the end of the war.','John Talbot','Talbot'),
                      d('S01-CH03-B02-L100','I will remember.','MC','MC'),
                      d('S01-CH03-B02-L110','Good. I would rather my enemies learn something.','John Talbot','Talbot'),
                      a('S01-CH03-B02-L120','Jeanne looks past the prisoners toward the road north-east.'),
                      d('S01-CH03-B02-L130','Reims.','Jeanne d’Arc','Jeanne'),
                      t('S01-CH03-B02-L140','CH03-N05 — The Road to Reims.')
                    ])
                ], { location: 'Near Patay', time: '18 June 1429' }),

              draftNode('CH03-N05', 'The Road to Reims', 'story',
                'With the Loire campaign won, the army moves toward Reims. Charles VII enters the chapter directly, and MC sees the political meaning of Jeanne’s campaign becoming larger than any one battlefield.', [
                  beat('CH03-N05-BEAT-01', 1, 'The King Before the Crown', 'travel-dialogue', ['MC','Jeanne d’Arc','Charles VII','Julie d’Aubigny','Jean II d’Alençon'],
                    'On the march, MC finally speaks directly with Charles while towns and gates along the route become political choices rather than tactical objectives.',
                    'Keep Charles human and cautious. The story should not require MC to instantly revere him.', 'dialogue advance', 'reims_march',
                    'MC understands that Jeanne’s goal is not simply military victory but making Charles publicly king at Reims.', 'CH03-N06', [
                      a('S01-CH03-N05-L010','The campaign road is quieter than the battles, but every town ahead carries another decision about opening its gates.'),
                      d('S01-CH03-N05-L020','You are the one from nowhere.','Charles VII','Charles'),
                      d('S01-CH03-N05-L030','That is becoming an uncomfortable reputation.','MC','MC'),
                      d('S01-CH03-N05-L040','I know something about uncomfortable reputations.','Charles VII','Charles'),
                      d('S01-CH03-N05-L050','Jeanne says the road ends at Reims.','MC','MC'),
                      d('S01-CH03-N05-L060','If the city receives us, it begins there. A crown is useful because people agree it means something.','Charles VII','Charles'),
                      d('S01-CH03-N05-L070','And if they do not agree?','MC','MC'),
                      d('S01-CH03-N05-L080','Then France continues arguing with itself.','Charles VII','Charles'),
                      a('S01-CH03-N05-L090','MC looks toward Jeanne riding farther up the column.'),
                      t('S01-CH03-N05-L100','CH03-N06 — The Crown at Reims.')
                    ])
                ], { location: 'Road to Reims', time: 'Late June–July 1429' }),

              draftNode('CH03-N06', 'The Crown at Reims', 'story',
                'Charles is crowned at Reims. The chapter closes on the apparent fulfillment of Jeanne’s great public mission and the first subtle suggestion that the world does not feel as settled as it should.', [
                  beat('CH03-N06-BEAT-01', 1, 'The Crown', 'chapter-end', ['MC','Jeanne d’Arc','Charles VII','Julie d’Aubigny','Hangaku Gozen','La Hire','Bradamante'],
                    'The coronation is primarily narrative. MC watches Charles crowned and sees Jeanne briefly without the battlefield around her.',
                    'Deliver a genuine emotional high, then introduce only a restrained anomaly clue after it. Do not explain the cosmology.', 'dialogue advance', 'coronation',
                    'Chapter 3 ends with Charles crowned, MC and Jeanne closer, and a faint wrongness that points toward the darker second half of the Saga.', 'CH04', [
                      n('S01-CH03-N06-L010','Reims — 17 July 1429'),
                      a('S01-CH03-N06-L020','The cathedral is filled with ceremony, heat, armor, cloth, incense, and people trying not to miss history happening in front of them.'),
                      a('S01-CH03-N06-L030','Charles receives the crown. The sound inside the cathedral swells.'),
                      d('S01-CH03-N06-L040','So that is it?','MC','MC'),
