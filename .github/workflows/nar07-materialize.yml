                      d('S01-CH03-N06-L060','You do not sound finished.','MC','MC'),
                      d('S01-CH03-N06-L070','I do not think France is finished.','Jeanne d’Arc','Jeanne'),
                      a('S01-CH03-N06-L080','For a heartbeat, light bends strangely across a distant pane of glass. MC turns toward it.'),
                      d('S01-CH03-N06-L090','Did you see that?','MC','MC'),
                      d('S01-CH03-N06-L100','See what?','Julie d’Aubigny','Julie'),
                      a('S01-CH03-N06-L110','The light is normal again.'),
                      n('S01-CH03-N06-L120','CHAPTER 3 COMPLETE'),
                      t('S01-CH03-N06-L130','Next: Chapter 4 — The Maid Falls.')
                    ])
                ], { location: 'Reims Cathedral', time: '17 July 1429' })
            ]
          };

          saga.chapters.push(ch02, ch03);

          for (const chapter of [ch02, ch03]) {
            for (const entry of chapter.nodes) {
              for (const b of entry.beats) {
                const mode = entry.type === 'battle' ? 'player' : 'advance';
                const slots = {};
                const names = b.characters.slice(0, 3);
                if (names[0]) slots.left = { character: names[0], shortLabel: names[0].slice(0,3).toUpperCase(), pose: 'active' };
                if (names[1]) slots.center = { character: names[1], shortLabel: names[1].slice(0,3).toUpperCase(), pose: 'active' };
                if (names[2]) slots.right = { character: names[2], shortLabel: names[2].slice(0,3).toUpperCase(), pose: 'active' };
                production.beats[b.id] = {
                  timing: mode === 'player' ? { mode, minSeconds: 30, maxSeconds: 180 } : { mode, estimatedSeconds: Math.max(18, b.script.length * 4) },
                  staging: {
                    background: entry.location ?? chapter.title,
                    camera: entry.type === 'battle' ? 'Tactical overview → event focus' : 'Scene framing → character focus',
                    slots,
                  },
                  events: [
                    { type: 'action', text: b.screenAction },
                    { type: 'dialogue', text: b.dialogueIntent },
                    { type: 'transition', text: `Continue to ${b.next}.` },
                  ],
                };
              }
            }
          }

          fs.writeFileSync(storyPath, `${JSON.stringify(story, null, 2)}\n`);
          fs.writeFileSync(productionPath, `${JSON.stringify(production, null, 2)}\n`);
          NODE

      - name: Format narrative JSON
        run: npx --yes @biomejs/biome@2.5.14 format --write content/narrative/story.json content/narrative/story-production.json

      - name: Validate Story Studio
        run: node apps/story-studio/build.mjs

      - name: Commit materialized narrative
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/narrative/story.json content/narrative/story-production.json
          git commit -m 'GAME-NAR07: draft Chapter 2 and Chapter 3 narrative'
          git push
