name: GAME-UI23 Format

on:
  push:
    branches: [game-ui23/login-account-gate]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-ui23/login-account-gate

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: |
          pnpm exec biome check --write --unsafe \
            apps/web/src/auth-screen.tsx \
            apps/web/src/auth-screen.css \
            apps/web/src/main.tsx \
            apps/web/src/settings-dialog.tsx \
            tests/e2e/auth.spec.ts || true

      - name: Remove temporary formatter and commit
        run: |
          rm .github/workflows/format-game-ui23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "GAME-UI23 format login account gate"
          git push origin HEAD:game-ui23/login-account-gate
