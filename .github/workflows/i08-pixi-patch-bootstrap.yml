name: GAME-I08 Pixi Patch Bootstrap

on:
  push:
    branches: [game-i08/production-renderer]

permissions:
  contents: write

concurrency:
  group: game-i08-pixi-patch-bootstrap
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'GAME-I08 patch Pixi TypeScript declaration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-i08/production-renderer

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Create narrow Pixi declaration patch
        run: |
          rm -rf .pixi-patch
          pnpm patch pixi.js@8.22.0 --edit-dir .pixi-patch
          python - <<'PY'
          from pathlib import Path
          path = Path('.pixi-patch/lib/scene/text-bitmap/AbstractBitmapFont.d.ts')
          text = path.read_text()
          old = "readonly distanceField: BitmapFontData['distanceField'];"
          new = "readonly distanceField: NonNullable<BitmapFontData['distanceField']>;"
          if old not in text:
              raise SystemExit('Expected Pixi declaration line was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm patch-commit .pixi-patch
          pnpm install --frozen-lockfile
          pnpm --filter @fantasia/web typecheck

      - name: Commit generated patch metadata
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml patches
          git commit -m "GAME-I08 patch Pixi TypeScript declaration"
          git push origin HEAD:game-i08/production-renderer
