name: GAME-I08 Lockfile Bootstrap

on:
  push:
    branches: [game-i08/production-renderer]

permissions:
  contents: write

concurrency:
  group: game-i08-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'GAME-I08 regenerate Pixi lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-i08/production-renderer

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Add exact production renderer dependency
        run: pnpm add --filter @fantasia/web --save-exact pixi.js@8.22.0

      - name: Commit generated manifest and lockfile
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile update required."
            exit 0
          fi
          git commit -m "GAME-I08 regenerate Pixi lockfile [skip ci]"
          git push origin HEAD:game-i08/production-renderer
