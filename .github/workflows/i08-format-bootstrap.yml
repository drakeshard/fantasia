name: GAME-I08 Formatter Bootstrap

on:
  push:
    branches: [game-i08/production-renderer]

permissions:
  contents: write

concurrency:
  group: game-i08-format-bootstrap
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'GAME-I08 apply Biome formatting') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-i08/production-renderer

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Apply exact lint corrections and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('apps/web/src/battle-renderer.ts')
          text = renderer.read_text()
          text = text.replace(
              'this.#app.stage.removeChildren().forEach((child) => child.destroy({ children: true }));',
              'this.#app.stage.removeChildren().forEach((child) => {\n      child.destroy({ children: true });\n    });',
          )
          renderer.write_text(text)

          main = Path('apps/web/src/main.tsx')
          text = main.read_text()
          text = text.replace('\n            aria-label="Interactive Pixi battlefield canvas"', '')
          main.write_text(text)
          PY
          pnpm exec biome check --write \
            apps/web/src/battle-renderer.ts \
            apps/web/src/main.tsx \
            packages/runtime/src/production-battle.ts \
            tests/e2e/bootstrap.spec.ts \
            tests/integration/production-battle.test.ts

      - name: Commit corrections
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/battle-renderer.ts \
            apps/web/src/main.tsx \
            packages/runtime/src/production-battle.ts \
            tests/e2e/bootstrap.spec.ts \
            tests/integration/production-battle.test.ts
          if git diff --cached --quiet; then
            echo "No formatting update required."
            exit 0
          fi
          git commit -m "GAME-I08 apply Biome formatting"
          git push origin HEAD:game-i08/production-renderer
