                      { id: 'S01-FIN-N01-L100', type: 'dialogue', text: 'Long enough if we stop talking.', speaker: 'Bradamante', displayLabel: 'Bradamante' },
                      { id: 'S01-FIN-N01-L110', type: 'dialogue', text: 'We reach Jeanne. Then we get out.', speaker: 'MC', displayLabel: 'MC' },
                      { id: 'S01-FIN-N01-L120', type: 'transition', text: 'FIN-B01 — Before the Fire.' }
                    ]
                  }
                ]
              },
              {
