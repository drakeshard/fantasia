                      { id: 'S01-FIN-B01-L020', type: 'dialogue', text: "Don't spread out. We only need one road to her.", speaker: 'Julie d’Aubigny', displayLabel: 'Julie' },
                      { id: 'S01-FIN-B01-L030', type: 'dialogue', text: 'Then make it ours.', speaker: 'MC', displayLabel: 'MC' },
                      { id: 'S01-FIN-B01-L040', type: 'action', text: 'Hangaku suppresses one side of the route while Bradamante forces space on the other. MC and Julie push toward Jeanne.' }
                    ]
