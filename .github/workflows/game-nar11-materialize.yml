                      { id: 'S01-FIN-N03-L110', type: 'dialogue', text: "That's not much of a reason.", speaker: 'MC', displayLabel: 'MC' },
                      { id: 'S01-FIN-N03-L120', type: 'dialogue', text: 'It was enough for you.', speaker: 'Jeanne d’Arc', displayLabel: 'Jeanne' },
                      { id: 'S01-FIN-N03-L130', type: 'action', text: 'Jeanne steps beside MC. Behind them, the broken street folds again.' },
                      { id: 'S01-FIN-N03-L140', type: 'dialogue', text: "Decide fast. It's closing.", speaker: 'Julie d’Aubigny', displayLabel: 'Julie' },
                      { id: 'S01-FIN-N03-L150', type: 'action', text: 'MC and Jeanne enter the bent light. The distortion surges outward across the street before anyone can tell who else it catches.' },
                      { id: 'S01-FIN-N03-L160', type: 'narration', text: 'SAGA I — THE MAID OF FRANCE COMPLETE' },
                      { id: 'S01-FIN-N03-L170', type: 'transition', text: 'Whiteout. The destination is unknown.' }
                    ]
                  }
                ]
              }
            ]
          };

          saga.chapters.push(finale);

          const shortLabels = new Map([
            ['MC', 'MC'],
            ['Julie d’Aubigny', 'JUL'],
            ['Hangaku Gozen', 'HAN'],
            ['Bradamante', 'BRA'],
            ['Jeanne d’Arc', 'JEA'],
            ['English guards', 'ENG'],
            ['First Manifestation', 'MAN'],
            ['Correction forms', 'COR']
          ]);

          function addProductionBeat(node, beat) {
            const isPlayer = /battle|escape|survive/i.test(beat.playerControl);
            const slots = {};
            for (const [index, character] of (beat.characters ?? []).slice(0, 3).entries()) {
              const slot = ['left', 'center', 'right'][index];
              slots[slot] = {
                character,
                shortLabel: shortLabels.get(character) ?? character.slice(0, 3).toUpperCase(),
                pose: 'active'
              };
            }
            production.beats[beat.id] = {
              timing: isPlayer
                ? { mode: 'player', minSeconds: 25, maxSeconds: 120 }
                : { mode: 'advance', estimatedSeconds: 30 },
              staging: {
                background: node.location ?? 'Rouen',
                camera: node.type === 'battle' ? 'Tactical overview → event focus' : 'Scene framing → character focus',
                slots
              },
              events: [
                { type: 'action', text: beat.screenAction },
                { type: 'dialogue', text: beat.dialogueIntent },
                { type: 'transition', text: `Continue to ${beat.next}.` }
              ]
            };
          }

          for (const node of finale.nodes) {
            for (const beat of node.beats) addProductionBeat(node, beat);
          }

          fs.writeFileSync(storyPath, `${JSON.stringify(story, null, 2)}\n`);
          fs.writeFileSync(productionPath, `${JSON.stringify(production, null, 2)}\n`);
          console.log(`Polished ${polishedLines} CH04/CH05 dialogue lines and added ${finale.nodes.length} Finale nodes.`);
          NODE

      - name: Commit generated narrative change and remove materializer
        shell: bash
        run: |
          rm .github/workflows/game-nar11-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/narrative/story.json content/narrative/story-production.json .github/workflows/game-nar11-materialize.yml
          git commit -m "GAME-NAR11: polish dialogue and add Saga I finale"
          git push origin HEAD:game-nar11/dialogue-finale
