                    screenAction: 'With Jeanne free, the party stops trying to control the square and fights only for enough space to move her beyond the execution point.',
                    dialogueIntent: 'The rescue must genuinely succeed. The expected death is prevented before anything supernatural interrupts.',
                    playerControl: 'battle control / escape',
                    trigger: 'jeanne_freed',
                    result: 'Jeanne leaves the execution point alive. The expected historical ending has been changed.',
                    next: 'FIN-B02',
                    scriptStatus: 'draft',
                    script: [
                      { id: 'S01-FIN-B01-L120', type: 'control', text: 'Objective update: ESCAPE THE SQUARE with Jeanne.' },
                      { id: 'S01-FIN-B01-L130', type: 'dialogue', text: "You still don't have a plan.", speaker: 'Jeanne d’Arc', displayLabel: 'Jeanne' },
                      { id: 'S01-FIN-B01-L140', type: 'dialogue', text: "I have the part where you're alive.", speaker: 'MC', displayLabel: 'MC' },
                      { id: 'S01-FIN-B01-L150', type: 'dialogue', text: "That's not a plan.", speaker: 'Jeanne d’Arc', displayLabel: 'Jeanne' },
                      { id: 'S01-FIN-B01-L160', type: 'dialogue', text: "It's more than we had yesterday.", speaker: 'Julie d’Aubigny', displayLabel: 'Julie' },
                      { id: 'S01-FIN-B01-L170', type: 'action', text: 'The group clears the execution point with Jeanne alive. For one heartbeat, the square sounds impossibly far away.' },
                      { id: 'S01-FIN-B01-L180', type: 'transition', text: 'FIN-B02 — The First Manifestation.' }
                    ]
                  }
                ]
              },
              {
                id: 'FIN-B02',
                title: 'The First Manifestation',
                type: 'battle',
                status: 'draft',
                scriptStatus: 'draft',
                location: 'Rouen — Vieux-Marché and fractured overlap',
                time: '30 May 1431 — moments later',
                summary: 'Reality reacts to Jeanne surviving her expected ending. A presence manifests without a stable final form, states only the minimum contradiction, and a Correction begins. The party cannot solve or defeat the deeper phenomenon; the tactical goal is to protect Jeanne and survive until a new Fracture creates an escape route.',
                beats: [
                  {
                    id: 'FIN-B02-BEAT-01',
                    order: 1,
                    title: 'Reality Reacts',
                    presentation: 'manifestation-event',
                    characters: ['MC', 'Jeanne d’Arc', 'Julie d’Aubigny', 'First Manifestation'],
                    screenAction: 'Light, distance, and sound stop agreeing with one another. The distortion gathers into a presence that refuses to hold one stable shape.',
                    dialogueIntent: 'Reveal only the contradiction: Jeanne was expected to die here, MC was not expected to be present, and the changed outcome is treated as a problem. Explain nothing beyond that.',
                    playerControl: 'dialogue advance',
                    trigger: 'jeanne_survives_expected_end',
                    result: 'The First Manifestation identifies the broken expected outcome and initiates a Correction.',
