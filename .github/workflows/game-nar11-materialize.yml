                    screenAction: 'The party breaks from the crowd and opens one narrow route toward Jeanne. The goal is contact, not defeating every guard in the square.',
                    dialogueIntent: 'Make the first phase focused and legible: one road to Jeanne, with the group covering different pressures rather than becoming an army.',
                    playerControl: 'battle control',
