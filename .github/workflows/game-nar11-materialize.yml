                    next: 'FIN-B01-BEAT-03',
                    scriptStatus: 'draft',
                    script: [
                      { id: 'S01-FIN-B01-L050', type: 'control', text: 'Objective update: FREE JEANNE and keep the retreat lane open.' },
                      { id: 'S01-FIN-B01-L060', type: 'dialogue', text: '{{MC_NAME}}?', speaker: 'Jeanne d’Arc', displayLabel: 'Jeanne' },
