name: GAME-NAR11 Materialize

on:
  push:
    branches:
      - game-nar11/dialogue-finale

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-nar11/dialogue-finale
          fetch-depth: 0

      - name: Polish CH04/CH05 dialogue and add Finale
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const storyPath = 'content/narrative/story.json';
          const productionPath = 'content/narrative/story-production.json';
          const story = JSON.parse(fs.readFileSync(storyPath, 'utf8'));
          const production = JSON.parse(fs.readFileSync(productionPath, 'utf8'));
          const saga = story.sagas.find((entry) => entry.id === 'S01');
          if (!saga) throw new Error('S01 not found');
          if (saga.chapters.some((chapter) => chapter.id === 'FIN')) {
            throw new Error('FIN already exists; materializer expected current main without Finale');
          }

          function naturalizeDialogue(text) {
            return text
              .replace(/\bDo not\b/g, "Don't")
              .replace(/\bdo not\b/g, "don't")
              .replace(/\bDoes not\b/g, "Doesn't")
              .replace(/\bdoes not\b/g, "doesn't")
              .replace(/\bDid not\b/g, "Didn't")
              .replace(/\bdid not\b/g, "didn't")
              .replace(/\bCannot\b/g, "Can't")
              .replace(/\bcannot\b/g, "can't")
              .replace(/\bCan not\b/g, "Can't")
              .replace(/\bcan not\b/g, "can't")
              .replace(/\bWill not\b/g, "Won't")
              .replace(/\bwill not\b/g, "won't")
              .replace(/\bWould not\b/g, "Wouldn't")
              .replace(/\bwould not\b/g, "wouldn't")
              .replace(/\bShould not\b/g, "Shouldn't")
              .replace(/\bshould not\b/g, "shouldn't")
              .replace(/\bCould not\b/g, "Couldn't")
              .replace(/\bcould not\b/g, "couldn't")
              .replace(/\bIs not\b/g, "Isn't")
              .replace(/\bis not\b/g, "isn't")
              .replace(/\bAre not\b/g, "Aren't")
              .replace(/\bare not\b/g, "aren't")
              .replace(/\bWas not\b/g, "Wasn't")
              .replace(/\bwas not\b/g, "wasn't")
              .replace(/\bWere not\b/g, "Weren't")
              .replace(/\bwere not\b/g, "weren't")
              .replace(/\bHave not\b/g, "Haven't")
              .replace(/\bhave not\b/g, "haven't")
              .replace(/\bHas not\b/g, "Hasn't")
              .replace(/\bhas not\b/g, "hasn't")
              .replace(/\bHad not\b/g, "Hadn't")
              .replace(/\bhad not\b/g, "hadn't")
              .replace(/\bI am\b/g, "I'm")
              .replace(/\bWe are\b/g, "We're")
              .replace(/\bwe are\b/g, "we're")
              .replace(/\bYou are\b/g, "You're")
              .replace(/\byou are\b/g, "you're")
              .replace(/\bThey are\b/g, "They're")
              .replace(/\bthey are\b/g, "they're")
              .replace(/\bThat is\b/g, "That's")
              .replace(/\bthat is\b/g, "that's")
              .replace(/\bThere is\b/g, "There's")
              .replace(/\bthere is\b/g, "there's")
              .replace(/\bIt is\b/g, "It's")
              .replace(/\bit is\b/g, "it's");
          }

          let polishedLines = 0;
          for (const chapterId of ['CH04', 'CH05']) {
            const chapter = saga.chapters.find((entry) => entry.id === chapterId);
            if (!chapter) throw new Error(`${chapterId} not found`);
            for (const node of chapter.nodes) {
              for (const beat of node.beats ?? []) {
                for (const event of beat.script ?? []) {
                  if (event.type !== 'dialogue' || event.speaker === 'Pierre Cauchon') continue;
                  const revised = naturalizeDialogue(event.text);
                  if (revised !== event.text) {
                    event.text = revised;
                    polishedLines += 1;
                  }
                }
              }
            }
          }
          if (polishedLines === 0) throw new Error('Dialogue polish changed no lines');

          const finale = {
            id: 'FIN',
            title: 'The First Manifestation',
            status: 'draft',
            nodes: [
              {
                id: 'FIN-N01',
                title: 'Vieux-Marché',
                type: 'story',
                status: 'draft',
                scriptStatus: 'draft',
                location: 'Rouen — Vieux-Marché approaches',
                time: '30 May 1431 — morning',
                summary: 'The party follows Jeanne toward the expected execution point and commits to one final rescue. They still know nothing about any larger rule governing her fate; this is a personal choice made because ordinary plans have run out.',
                beats: [
                  {
                    id: 'FIN-N01-BEAT-01',
                    order: 1,
                    title: 'The Procession',
                    presentation: 'finale-opening',
                    characters: ['MC', 'Julie d’Aubigny', 'Hangaku Gozen', 'Bradamante', 'Jeanne d’Arc', 'English guards'],
                    screenAction: 'Crowds compress the streets around Vieux-Marché while Jeanne is moved under guard. MC’s group stays split among ordinary movement until they can see the custody route clearly.',
                    dialogueIntent: 'Keep the opening human and immediate. Nobody knows a cosmic event is coming; the only goal is reaching Jeanne before the execution proceeds.',
                    playerControl: 'dialogue advance',
                    trigger: 'finale_start',
                    result: 'The party identifies Jeanne’s route and the last usable approach through the crowd.',
                    next: 'FIN-N01-BEAT-02',
                    scriptStatus: 'draft',
                    script: [
                      { id: 'S01-FIN-N01-L010', type: 'narration', text: 'Rouen — 30 May 1431, morning' },
                      { id: 'S01-FIN-N01-L020', type: 'action', text: 'Crowds press toward Vieux-Marché. English guards move Jeanne through the square while the party keeps to separate edges of the street.' },
                      { id: 'S01-FIN-N01-L030', type: 'dialogue', text: "Once we move, there's no clean way back.", speaker: 'Julie d’Aubigny', displayLabel: 'Julie' },
                      { id: 'S01-FIN-N01-L040', type: 'dialogue', text: "There hasn't been one for a while.", speaker: 'MC', displayLabel: 'MC' },
                      { id: 'S01-FIN-N01-L050', type: 'dialogue', text: "Then choose the moment. Don't let the crowd choose it for you.", speaker: 'Hangaku Gozen', displayLabel: 'Hangaku Gozen' },
                      { id: 'S01-FIN-N01-L060', type: 'action', text: 'MC catches sight of Jeanne between two moving lines of guards.' },
                      { id: 'S01-FIN-N01-L070', type: 'dialogue', text: 'There.', speaker: 'MC', displayLabel: 'MC' }
                    ]
                  },
                  {
                    id: 'FIN-N01-BEAT-02',
                    order: 2,
                    title: 'The Moment',
                    presentation: 'pre-battle',
                    characters: ['MC', 'Julie d’Aubigny', 'Hangaku Gozen', 'Bradamante'],
                    screenAction: 'The outer lane is still open, but the guard formation is tightening around Jeanne. Waiting any longer improves the guards’ position rather than the party’s.',
                    dialogueIntent: 'Turn the chapter handoff into a clear voluntary commitment, not a surprise encounter or miracle opening.',
