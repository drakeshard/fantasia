name: NAR06 Freeze

on:
  push:
    branches:
      - game-nar06/freeze-prologue-ch01

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-nar06/freeze-prologue-ch01

      - name: Apply owner-approved narrative status
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'content/narrative/story.json';
          let text = fs.readFileSync(path, 'utf8');
          const draftStatusCount = (text.match(/"status": "draft"/g) ?? []).length;
          const draftScriptCount = (text.match(/"scriptStatus": "draft"/g) ?? []).length;
          if (draftStatusCount !== 4) throw new Error(`expected 4 draft structural statuses, found ${draftStatusCount}`);
          if (draftScriptCount === 0) throw new Error('expected draft script statuses');
          text = text.replaceAll('"status": "draft"', '"status": "approved-structure"');
          text = text.replaceAll('"scriptStatus": "draft"', '"scriptStatus": "approved"');
          fs.writeFileSync(path, text);
          NODE

      - name: Validate story
        run: node apps/story-studio/build.mjs

      - name: Commit freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/narrative/story.json
          git commit -m 'GAME-NAR06: freeze Prologue and Chapter 1 script'
          git push
