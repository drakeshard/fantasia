name: NAR09 format

on:
  push:
    branches:
      - game-nar09/reputation-cluster-beats

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare shared packages
        run: node scripts/prepare-shared-packages.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format NAR09 files
        run: pnpm exec biome check --write apps/story-studio/build.mjs apps/story-studio/src/app.js content/narrative/story.json content/narrative/story-production.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/story-studio/build.mjs apps/story-studio/src/app.js content/narrative/story.json content/narrative/story-production.json
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "GAME-NAR09: format narrative revision"
          git push
