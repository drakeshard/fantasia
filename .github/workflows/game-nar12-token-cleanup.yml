name: GAME-NAR12 Token Cleanup

on:
  push:
    branches:
      - game-nar12/mc-titles-finale-revision

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-nar12/mc-titles-finale-revision
          fetch-depth: 0

      - name: Remove stale token metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('content/narrative/story.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          targets = {'S01-CH01-N01-L340', 'S01-CH01-N01-L700'}
          seen = set()
          for saga in data['sagas']:
              for chapter in saga['chapters']:
                  for node in chapter.get('nodes', []):
                      for beat in node.get('beats', []):
                          for event in beat.get('script', []):
                              if event.get('id') in targets:
                                  event.pop('tokenized', None)
                                  seen.add(event['id'])
          assert seen == targets, (seen, targets)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare and format
        run: |
          node scripts/prepare-shared-packages.mjs
          pnpm install --frozen-lockfile
          pnpm check:write

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Drakeshard Narrative Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/game-nar12-token-cleanup.yml
          git add content/narrative/story.json
          OTHER=$(git diff --cached --name-only | grep -vE '^(content/narrative/story.json|.github/workflows/game-nar12-token-cleanup.yml)$' || true)
          if [ -n "$OTHER" ]; then echo "Unexpected paths: $OTHER"; exit 1; fi
          git diff --cached --check
          git commit -m "chore(narrative): clear stale MC token metadata"
          git push origin HEAD:game-nar12/mc-titles-finale-revision
