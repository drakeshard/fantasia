name: NAR10 materialize

on:
  push:
    branches:
      - game-nar10/ch02-ch03-freeze-ch04-ch05

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare shared packages
        run: node scripts/prepare-shared-packages.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize narrative revision
        run: python3 scripts/nar10-materialize.py
      - name: Format narrative files
        run: pnpm exec biome check --write content/narrative/story.json content/narrative/story-production.json
      - name: Validate Story Studio
        run: pnpm story:build
      - name: Commit generated revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/narrative/story.json content/narrative/story-production.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "GAME-NAR10: freeze CH02 CH03 and draft CH04 CH05"
          git push
