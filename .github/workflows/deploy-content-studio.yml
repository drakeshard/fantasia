name: Deploy Content Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-content-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs

      - name: Verify shared-library provenance
        run: node scripts/verify-shared-packages.mjs

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Content Studio deployment contract
        run: pnpm check:content-studio-deployment

      - name: Build Content Studio
        run: pnpm --filter @fantasia/content-studio build

      - name: Verify deployment output
        run: test -f apps/content-studio/dist/index.html

      - name: Deploy Content Studio
        run: pnpm dlx wrangler@4.148.0 deploy --config wrangler.content-studio.jsonc
