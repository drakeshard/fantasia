name: STUDIO03 branch formatter

on:
  push:
    branches: [game-studio03/read-models-provider-adapters]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-studio03/read-models-provider-adapters
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format STUDIO03 files
        run: >-
          pnpm exec biome check --write
          packages/studio-read-model/src/index.ts
          scripts/check-studio-read-model.mjs
          supabase/functions/studio-operations/contract.ts
          supabase/functions/studio-operations/index.ts
          supabase/functions/studio-operations/missing-canonical.ts
          supabase/functions/studio-operations/read-model-adapters.ts
          tests/integration/studio-read-model.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/studio-read-model/src/index.ts scripts/check-studio-read-model.mjs supabase/functions/studio-operations/contract.ts supabase/functions/studio-operations/index.ts supabase/functions/studio-operations/missing-canonical.ts supabase/functions/studio-operations/read-model-adapters.ts tests/integration/studio-read-model.test.ts
          git commit -m "style(studio): format STUDIO03 read-model implementation"
          git push origin HEAD:game-studio03/read-models-provider-adapters
