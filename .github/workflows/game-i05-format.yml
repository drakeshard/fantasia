name: GAME-I05 Format

on:
  push:
    branches:
      - game-i05/combat-encounter-foundations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-i05/combat-encounter-foundations
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pinned shared-library artifacts
        run: node scripts/prepare-shared-packages.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec biome check --write .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "GAME-I05 apply Biome formatting"
          git push origin HEAD:game-i05/combat-encounter-foundations
