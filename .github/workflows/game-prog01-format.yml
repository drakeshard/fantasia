name: GAME-PROG01 Format

on:
  push:
    branches:
      - game-prog01/account-talents

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: game-prog01/account-talents
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game/src/talent tests/integration/talent-progression.test.ts
          git commit -m "chore: format GAME-PROG01 changes"
          git push
