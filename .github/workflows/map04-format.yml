name: MAP04 Format

on:
  push:
    branches:
      - game-map04/fullscreen-review-camera

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-map04/fullscreen-review-camera
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Fix MAP04 semantic markup and local warning
        run: |
          python - <<'PY'
          from pathlib import Path
          tsx = Path('apps/web/src/map-review.tsx')
          text = tsx.read_text()
          text = text.replace(
              '<div class="map-review-camera-controls" aria-label="Review camera controls">',
              '<div class="map-review-camera-controls" role="group" aria-label="Review camera controls">',
          )
          tsx.write_text(text)

          css = Path('apps/web/src/map-review.css')
          text = css.read_text()
          text = text.replace(
              '\n@media (prefers-reduced-motion: reduce) {\n  .map-review * {\n    scroll-behavior: auto !important;\n  }\n}\n',
              '\n',
          )
          css.write_text(text)
          PY
      - name: Format MAP04 files
        run: pnpm exec biome check --write apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx apps/web/src/map-review.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/map-review-renderer.ts apps/web/src/map-review.tsx apps/web/src/map-review.css
          git commit -m "GAME-MAP04: format review workspace"
          git push origin HEAD:game-map04/fullscreen-review-camera
