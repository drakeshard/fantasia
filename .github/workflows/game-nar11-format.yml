name: GAME-NAR11 Format

on:
  push:
    branches:
      - game-nar11/dialogue-finale

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-nar11/dialogue-finale
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write content/narrative/story.json content/narrative/story-production.json
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/game-nar11-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/narrative/story.json content/narrative/story-production.json .github/workflows/game-nar11-format.yml
          git commit -m "GAME-NAR11: format narrative data"
          git push origin HEAD:game-nar11/dialogue-finale
