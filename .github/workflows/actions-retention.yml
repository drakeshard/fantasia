name: Actions Retention

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-retention.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report deletions without removing workflow runs"
        required: true
        type: boolean
        default: true
      branch:
        description: "Optional non-default branch to clean immediately"
        required: false
        type: string
      stale_days:
        description: "Age threshold for scheduled/manual stale-branch cleanup"
        required: true
        type: number
        default: 7

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    name: Cleanup obsolete runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
      MANUAL_BRANCH: ${{ inputs.branch }}
      STALE_DAYS_INPUT: ${{ inputs.stale_days }}
    steps:
      - name: Cleanup completed workflow runs
        shell: bash
        run: |
          set -euo pipefail

          keep_workflows=("Quality")
          dry_run="false"
          stale_days="7"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            dry_run="${DRY_RUN_INPUT:-true}"
            stale_days="${STALE_DAYS_INPUT:-7}"
          fi

          delete_run() {
            local run_id="$1"
            local run_name="$2"
            local branch_name="$3"
            local conclusion="$4"
            local created_at="$5"

            echo "delete candidate: id=${run_id} workflow=${run_name} branch=${branch_name} conclusion=${conclusion} created=${created_at}"

            if [[ "$dry_run" == "true" ]]; then
              echo "dry-run: keeping ${run_id}"
              return
            fi

            delete_error_file="$(mktemp)"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}" 2>"${delete_error_file}"; then
              rm -f "${delete_error_file}"
              echo "deleted run ${run_id}"
              return
            fi

            if grep -q "HTTP 404" "${delete_error_file}"; then
              echo "already absent: run ${run_id}"
              rm -f "${delete_error_file}"
              return
            fi

            cat "${delete_error_file}" >&2
            rm -f "${delete_error_file}"
            return 1
          }

          cleanup_branch() {
            local branch_name="$1"
            echo "cleaning branch: ${branch_name}"

            local runs
            runs="$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/actions/runs?branch=${branch_name}&status=completed&per_page=100" \
              --jq '.workflow_runs[] | [.id,.name,.conclusion,.created_at,.head_branch] | @tsv')"

            [[ -z "$runs" ]] && return

            declare -A kept=()

            while IFS=$'\t' read -r run_id run_name conclusion created_at head_branch; do
              [[ -z "$run_id" ]] && continue
              [[ "$head_branch" != "$branch_name" ]] && continue
              [[ "$run_name" == "Actions Retention" ]] && continue

              local keep_this="false"
              for keep_name in "${keep_workflows[@]}"; do
                if [[ "$run_name" == "$keep_name" && -z "${kept[$run_name]:-}" ]]; then
                  kept["$run_name"]="$run_id"
                  keep_this="true"
                  echo "keep newest: id=${run_id} workflow=${run_name} branch=${branch_name}"
                  break
                fi
              done

              if [[ "$keep_this" == "true" ]]; then
                continue
              fi

              delete_run "$run_id" "$run_name" "$branch_name" "$conclusion" "$created_at"
            done < <(printf '%s\n' "$runs")
          }

          has_open_pr() {
            local branch_name="$1"
            local open_pr_count
            open_pr_count="$(gh api \
              "repos/${GH_REPO}/pulls?state=open&head=${{ github.repository_owner }}:${branch_name}&per_page=1" \
              --jq 'length')"
            [[ "$open_pr_count" != "0" ]]
          }

          all_non_default_branches() {
            local repo_id
            repo_id="$(gh api "repos/${GH_REPO}" --jq '.id')"

            gh api --paginate \
              "repos/${GH_REPO}/actions/runs?status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_repository.id == ${repo_id}) | [.head_branch,.created_at] | @tsv" |
            awk -F '\t' -v default_branch="${DEFAULT_BRANCH}" '$1 != default_branch && $1 != "" { print }' |
            sort -k1,1 -k2,2r |
            awk -F '\t' '!seen[$1]++ { print $1 "\t" $2 }'
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_HEAD_REPO}" != "${GH_REPO}" ]]; then
              echo "skip fork PR branch: ${PR_HEAD_REPO}:${PR_HEAD_REF}"
              exit 0
            fi

            if [[ -z "${PR_HEAD_REF}" || "${PR_HEAD_REF}" == "${DEFAULT_BRANCH}" ]]; then
              echo "nothing to clean"
              exit 0
            fi

            cleanup_branch "${PR_HEAD_REF}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_BRANCH:-}" ]]; then
            if [[ "${MANUAL_BRANCH}" == "${DEFAULT_BRANCH}" ]]; then
              echo "refusing to clean default branch: ${DEFAULT_BRANCH}"
              exit 1
            fi

            if has_open_pr "${MANUAL_BRANCH}"; then
              echo "refusing to clean branch with open PR: ${MANUAL_BRANCH}"
              exit 1
            fi

            cleanup_branch "${MANUAL_BRANCH}"
            exit 0
          fi

          mapfile -t branches < <(all_non_default_branches)

          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "bootstrap sweep: cleaning historical non-default branches"
            for entry in "${branches[@]}"; do
              branch_name="${entry%%$'\t'*}"
              if has_open_pr "$branch_name"; then
                echo "skip branch with open PR: ${branch_name}"
                continue
              fi
              cleanup_branch "$branch_name"
            done
            exit 0
          fi

          cutoff_epoch="$(date -u -d "-${stale_days} days" +%s)"

          for entry in "${branches[@]}"; do
            branch_name="${entry%%$'\t'*}"
            latest_created="${entry#*$'\t'}"
            latest_epoch="$(date -u -d "$latest_created" +%s)"

            if (( latest_epoch > cutoff_epoch )); then
              continue
            fi

            if has_open_pr "$branch_name"; then
              echo "skip branch with open PR: ${branch_name}"
              continue
            fi

            cleanup_branch "$branch_name"
          done
