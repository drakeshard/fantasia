name: STUDIO04 Format

on:
  push:
    branches:
      - game-studio04/canonical-git-proposals

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-studio04/canonical-git-proposals
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Format STUDIO04 files
        run: |
          pnpm biome check --write \
            scripts/check-studio-canonical-change.mjs \
            supabase/functions/studio-canonical-change/index.ts \
            supabase/functions/studio-operations/canonical-change.ts \
            supabase/functions/studio-operations/canonical-change-contract.ts \
            supabase/functions/studio-operations/github-proposals.ts \
            tests/integration/studio-canonical-change.test.ts \
            tests/integration/studio-authorization.test.ts \
            supabase/functions/studio-operations/contract.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-studio-canonical-change.mjs \
            supabase/functions/studio-canonical-change/index.ts \
            supabase/functions/studio-operations/canonical-change.ts \
            supabase/functions/studio-operations/canonical-change-contract.ts \
            supabase/functions/studio-operations/github-proposals.ts \
            tests/integration/studio-canonical-change.test.ts \
            tests/integration/studio-authorization.test.ts \
            supabase/functions/studio-operations/contract.ts
          git commit -m "chore(studio): format STUDIO04 files"
          git push origin HEAD:game-studio04/canonical-git-proposals
