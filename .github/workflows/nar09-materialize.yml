name: NAR09 materialize

on:
  push:
    branches:
      - game-nar09/reputation-cluster-beats

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Materialize narrative revision
        run: python scripts/nar09-materialize.py
      - name: Commit generated revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/narrative/story.json content/narrative/story-production.json apps/story-studio/src/app.js apps/story-studio/build.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "GAME-NAR09: restore beat granularity and reputation cluster"
          git push
