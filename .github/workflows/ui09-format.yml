name: UI09 Format

on:
  push:
    branches:
      - game-ui09/no-art-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui09/no-art-polish
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write apps/web/src/detail-polish.css apps/web/src/home.tsx apps/web/src/saga.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/detail-polish.css apps/web/src/home.tsx apps/web/src/saga.tsx
          git commit -m "chore: format GAME-UI09 files"
          git push origin HEAD:game-ui09/no-art-polish
