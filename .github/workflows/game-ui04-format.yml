name: GAME-UI04 format

on:
  push:
    branches:
      - game-ui04/campaign-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: game-ui04/campaign-shell
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node scripts/prepare-shared-packages.mjs
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted lint and smoke-test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          campaign = Path("apps/web/src/campaign.tsx")
          text = campaign.read_text()
          text = text.replace(
              '<div class="map-toolbar" aria-label="Map controls">',
              '<div class="map-toolbar" role="toolbar" aria-label="Map controls">',
          )
          campaign.write_text(text)

          e2e = Path("tests/e2e/bootstrap.spec.ts")
          text = e2e.read_text().replace(
              'page.getByText("LOIRE APPROACHES", { exact: true })',
              'page.getByText("Loire approaches", { exact: true })',
          )
          e2e.write_text(text)
          PY
      - run: pnpm exec biome check --write --unsafe . || true
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "chore: finalize GAME-UI04 lint fixes"
          git push origin HEAD:game-ui04/campaign-shell
