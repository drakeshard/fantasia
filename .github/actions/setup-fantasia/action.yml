name: Setup Fantasia

description: Prepare the Fantasia Node workspace with optional pinned shared-library artifacts.

inputs:
  prepare-shared:
    description: Prepare and verify pinned RPG/Tactical package artifacts before install.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .node-version

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Prepare pinned shared-library artifacts
      if: inputs.prepare-shared == 'true'
      shell: bash
      run: node scripts/prepare-shared-packages.mjs

    - name: Verify shared-library provenance
      if: inputs.prepare-shared == 'true'
      shell: bash
      run: node scripts/verify-shared-packages.mjs

    - name: Require committed lockfile
      shell: bash
      run: test -f pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
